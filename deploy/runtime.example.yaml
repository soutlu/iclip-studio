# 运行时服务（agent_runtime）配置样例：复制为部署目录的 configs/runtime.yaml（本地开发为 server/configs/runtime.yaml），
# 按环境调整服务地址与启用的插件段。字段定义以 runtime/src/agent_runtime/settings.py 与视频插件包
# plugins/video/src/iclip_video/registry.py（VideoPluginsConfig）为准，部署说明见 docs/deploy.md。
# 敏感凭证仅填写环境变量名；DATABASE_URL 与 CREDENTIAL_ENCRYPTION_KEYS 同样由环境变量读取。

apps:
  # 视频后端接入配置。应用标识须固定为 video（与既有会话归属一致）。
  video:
    # 须与后端 RUNTIME_APP_KEY 一致（不少于 32 个字符）。
    key_env: RUNTIME_APP_KEY
    # 允许经运行时 /v1/admin 管理技能库、模型供应商与 Agent 配置。
    admin: true
    hooks:
      # 须与后端 RUNTIME_INTERNAL_TOKEN 一致（不少于 32 个字符）。
      token_env: RUNTIME_INTERNAL_TOKEN
      # 后端内部回调接口（conventions §21）。本地 make dev 为 http://localhost:7788，Compose 为 http://server:7788。
      gate: http://server:7788/internal/runtime/hooks/gate
      run_started: http://server:7788/internal/runtime/hooks/run-started
      turn_started: http://server:7788/internal/runtime/hooks/turn-started

plugins:
  factory: iclip_video.registry:open_video_plugins
  config:
    # 视频拆解与抽帧出图经由视频后端内部接口执行；地址与令牌同 hooks 配置。
    internal_api:
      base_url: http://server:7788
      token_env: RUNTIME_INTERNAL_TOKEN
    # 探测本桶图片信息前将公网地址改写为内网地址；若服务器不在 OSS 同地域内网，请移除此段。
    # oss:
    #   public_url_base: https://<桶名>.oss-cn-shenzhen.aliyuncs.com
    #   internal_url_base: https://<桶名>.oss-cn-shenzhen-internal.aliyuncs.com
    # 配置此段即启用 video_breakdown 插件（委托后端参考视频拆解队列）。
    # 启动期会向后端核对服务状态，须确保后端已就绪且后端 config.yaml 已配置 iclip_studio 段，否则启动失败。
    # video_breakdown: {}
    # 配置此段即启用 shot_video 插件（抽帧拼板、宫格切图与分镜生图）。
    # 启动期会向后端核对服务状态，须确保后端已就绪且后端 config.yaml 已配置 shot_video: {}、media_generation 与 object_store，否则启动失败。
    # 出图轮询与重试策略（poll_interval_seconds、dev_attempts、pro_attempts、backoff_seconds、backoff_factor、
    # job_timeout_seconds）可在此段覆写，省略则使用默认值。
    # shot_video: {}

ops:
  log_level: INFO
  log_format: json
