# 单机部署编排：server（视频后端）、web（前端与 Nginx 反代）及仅内网可达的 runtime（Agent 运行时）与 render（成片渲染）。
# 数据库迁移须手动执行，容器启动不会自动建表；后端与运行时共用同一 PostgreSQL 实例的不同 Schema。
# 变量与凭证取自同目录 .env（不入库）：server 全量加载，runtime 仅透传下方 environment 所列变量。
# 本文件涉及变量：ACR_REGISTRY（镜像仓库地址，如 registry.<region>.aliyuncs.com）、ACR_NAMESPACE（命名空间）、
# IMAGE_TAG（后端/前端/渲染镜像版本，缺省 latest）、RUNTIME_IMAGE_TAG（运行时镜像版本，缺省 latest；两边分开记录与升级，
# 见 docs/deploy.md「升级」）、WEB_PORT（对外端口，缺省 80；修改时须同步更新 config.yaml 的 sso.redirect_url 端口）、
# RENDER_ALLOWED_MEDIA_HOSTS（渲染服务素材域名白名单）及运行时鉴权变量；后端密钥清单见 server/src/iclip/config/models.py。
# 运行配置与组件库均不入镜像：同目录 configs/ 只读挂载至后端（config.yaml）与运行时（runtime.yaml，样例见
# deploy/runtime.example.yaml），修改后须 restart 对应服务；模型、Agent 与技能存库并在后台管理页维护。
# 同目录 components/（catalog.json、<版本号>/ 与共享 vendor/）只读挂载至 web 与 render，更新组件库无需重启（见 docs/deploy.md「发布组件库」）。

services:
  server:
    image: ${ACR_REGISTRY}/${ACR_NAMESPACE}/iclip-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./configs:/app/configs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 本地视频处理（合成、拆解抽帧、分镜取帧）在启动期自动探测编码器：可用则启用 NVIDIA 硬件加速，否则回退软件编码。
    # 宿主机须安装 NVIDIA 驱动与 NVIDIA Container Toolkit，无 GPU 宿主机请移除本段，否则容器无法启动；
    # capabilities 中的 video 用于挂载 libnvidia-encode / libnvcuvid，缺失时 NVENC 不可用。
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, video]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7788/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Agent 运行时服务：承载对话运行、Transcript、实时事件流上游、工作区文件与管理接口，仅在 Compose 内网可达
  # （对应后端 config.yaml 的 runtime.url: http://runtime:7790），不对外暴露端口。须待后端健康后再启动，以便启动期
  # 向后端内部接口核对插件服务；后端启动不强依赖运行时，事件流会自动重连。
  runtime:
    image: ${ACR_REGISTRY}/${ACR_NAMESPACE}/iclip-runtime:${RUNTIME_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["python", "-m", "agent_runtime.main", "--config", "configs/runtime.yaml", "--host", "0.0.0.0", "--port", "7790"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # 模型供应商密钥的 Fernet 加密密钥，仅由运行时解密。
      CREDENTIAL_ENCRYPTION_KEYS: ${CREDENTIAL_ENCRYPTION_KEYS}
      # 对应 runtime.yaml 中 apps.video.key_env、hooks.token_env 与 plugins.config.internal_api.token_env，须与后端同名变量一致。
      RUNTIME_APP_KEY: ${RUNTIME_APP_KEY}
      RUNTIME_INTERNAL_TOKEN: ${RUNTIME_INTERNAL_TOKEN}
    volumes:
      - ./configs:/app/configs:ro
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7790/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 成片导出渲染服务：仅在 Compose 内网可达（对应后端 config.yaml 的 final_cut.render_url: http://render:8080），
  # 不对外暴露端口。RENDER_ALLOWED_MEDIA_HOSTS 指定允许下载的素材主机白名单，见 docs/deploy.md「成片渲染服务」。
  render:
    image: ${ACR_REGISTRY}/${ACR_NAMESPACE}/iclip-render:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # 未设置时渲染服务启动即退出并记录「配置不完整」。
      RENDER_ALLOWED_MEDIA_HOSTS: ${RENDER_ALLOWED_MEDIA_HOSTS:-}
    # 无头 Chrome 渲染所需共享内存（大于 Docker 默认 64 MB）。
    shm_size: 2gb
    volumes:
      - render-tmp:/tmp/iclip-render
      # 只读挂载共享组件库（对应镜像内 RENDER_REGISTRY_ROOT）
      - ./components:/app/registry:ro
    # graphics 供 Chrome WebGL 硬件渲染，video 供 NVENC 编码（启动日志与 /health 报告 hardware 或 software）；
    # 无 GPU 宿主机请移除本段，渲染将自动回退软件模式。
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, video, graphics]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    image: ${ACR_REGISTRY}/${ACR_NAMESPACE}/iclip-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      # 只读挂载共享组件库（对应站点路径 /hyperframes/）
      - ./components:/usr/share/nginx/html/hyperframes:ro
    depends_on:
      server:
        condition: service_healthy

volumes:
  # 渲染临时工作目录（存放素材、中间帧与成片），导出完成后自动清理。
  render-tmp:
