# 单机部署：后端 → nginx 前端，另有只在内网可达的运行时服务与成片渲染服务。数据库迁移由操作者手动执行，部署和服务
# 启动不执行迁移。Postgres 用服务器现有实例，本项目独占一个数据库，后端与运行时服务连同一个库。
# 变量与凭证来自同目录的 .env，server 容器整份加载它；运行时服务只拿下面 environment 列出的几项。env 文件不进仓库。
# 本文件用到的变量：ACR_REGISTRY 镜像仓库地址（如 registry.<region>.aliyuncs.com）、
# ACR_NAMESPACE 仓库里的命名空间、IMAGE_TAG 镜像版本（缺省 latest，升级时改它再 up -d）、
# WEB_PORT 对外端口（缺省 80，改了 SSO_REDIRECT_URL 的端口要跟着改）、RENDER_ALLOWED_MEDIA_HOSTS 渲染服务
# 允许取素材的主机，以及运行时服务那几项（见 runtime 段）。后端的应用变量见 server/src/iclip/config/models.py。
# 运行配置不进镜像也不进仓库：同目录的 configs/ 只读挂进后端（config.yaml）与运行时服务（runtime.yaml，样例是
# deploy/runtime.example.yaml），改了要 up -d。模型、agent 与技能存在数据库里，在配置页里改。成片的组件库也不进镜像：同目录的 components/（catalog.json 与
# <版本号>/）只读挂给 web 与 render，发布新组件库不用重启，步骤见 docs/deploy.md「发布组件库」。

services:
  server:
    image: ${ACR_REGISTRY}/${ACR_NAMESPACE}/iclip-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./configs:/app/configs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 本地视频加工（合成、拆解抽帧、分镜取帧）启动时探测，有 NVIDIA 显卡就用它编解码，没有用软件。
    # 宿主机要装 NVIDIA 驱动与 NVIDIA Container Toolkit，申请不到显卡容器起不来；没有显卡的机器删掉
    # 这一段。capabilities 里的 video 让容器里有 libnvidia-encode / libnvcuvid，少了它 NVENC 起不来。
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, video]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7788/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Agent 运行时服务：消息与运行、transcript、实时通道的上游、工作区文件与素材台账、配置页的管理接口。只在 compose
  # 网络里可达（后端 RUNTIME_URL=http://runtime:7790），不对外开端口。后端先起：运行时配置了 shot_video 或
  # video_breakdown 时启动就向后端的内部接口核对插件服务；后端启动时连不上运行时不影响启动，事件流会自己重连。
  runtime:
    image: ${ACR_REGISTRY}/${ACR_NAMESPACE}/iclip-runtime:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["python", "-m", "agent_runtime.main", "--config", "configs/runtime.yaml", "--host", "0.0.0.0", "--port", "7790"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # 模型供应商密钥的加密钥匙，只有运行时解密。
      CREDENTIAL_ENCRYPTION_KEYS: ${CREDENTIAL_ENCRYPTION_KEYS}
      # runtime.yaml 里 apps.video.key_env 与 hooks.token_env、plugins.config.internal_api.token_env 指向的变量，
      # 与后端用的是同一个值。
      RUNTIME_APP_KEY: ${RUNTIME_APP_KEY}
      RUNTIME_INTERNAL_TOKEN: ${RUNTIME_INTERNAL_TOKEN}
      # runtime.yaml 配了 plugins.config.video 时它的 api_key_env；没配视频理解时留空。
      VIDEO_UNDERSTANDING_API_KEY: ${VIDEO_UNDERSTANDING_API_KEY:-}
    volumes:
      - ./configs:/app/configs:ro
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7790/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 成片导出的渲染服务：只在 compose 网络里可达（后端 WHOLE_FILM_RENDER_URL=http://render:8080），
  # 不对外开端口。RENDER_ALLOWED_MEDIA_HOSTS 列出它会取素材的主机，见 docs/deploy.md「成片渲染服务」。
  render:
    image: ${ACR_REGISTRY}/${ACR_NAMESPACE}/iclip-render:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # 未设置时渲染服务启动即退出并记录「配置不完整」。
      RENDER_ALLOWED_MEDIA_HOSTS: ${RENDER_ALLOWED_MEDIA_HOSTS:-}
    # Chrome 渲染用共享内存，Docker 默认的 64 MB 不够。
    shm_size: 2gb
    volumes:
      - render-tmp:/tmp/iclip-render
      # 组件库，镜像里的 RENDER_REGISTRY_ROOT
      - ./components:/app/registry:ro
    # Chrome 用显卡渲染（WebGL）要 graphics，NVENC 编码要 video；启动日志与 /health 报告实际用的是
    # hardware 还是 software。没有显卡的机器删掉这一段，渲染照常、走软件。
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, video, graphics]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    image: ${ACR_REGISTRY}/${ACR_NAMESPACE}/iclip-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      # 组件库，站点上的 /hyperframes/
      - ./components:/usr/share/nginx/html/hyperframes:ro
    depends_on:
      server:
        condition: service_healthy

volumes:
  # 渲染服务的临时项目目录（素材、逐帧中间文件、成片），导出结束即删。
  render-tmp:
