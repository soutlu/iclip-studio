source_roots = ["src"]

[[modules]]
path = "agent_runtime.errors"
depends_on = []
utility = true

[[modules]]
path = "agent_runtime.urls"
depends_on = []
utility = true

[[modules]]
path = "agent_runtime.model_vocab"
depends_on = []
utility = true

[[modules]]
path = "agent_runtime.agent_usage"
depends_on = []
utility = true

[[modules]]
path = "agent_runtime.tool_args"
depends_on = []
utility = true

[[modules]]
path = "agent_runtime.file_store"
depends_on = []

[[modules]]
path = "agent_runtime.material_ledger"
depends_on = []

[[modules]]
path = "agent_runtime.run_deps"
depends_on = []

[[modules]]
path = "agent_runtime.transcript"
depends_on = []

[[modules]]
path = "agent_runtime.harness"
depends_on = [
    "agent_runtime.file_store",
    "agent_runtime.material_ledger",
    "agent_runtime.transcript",
]

[[modules]]
path = "agent_runtime.plugins"
depends_on = [
    "agent_runtime.file_store",
    "agent_runtime.material_ledger",
    "agent_runtime.run_deps",
    "agent_runtime.transcript",
    "agent_runtime.harness",
]

[[modules]]
path = "agent_runtime.config.skills"
depends_on = []

# 试连是端口，由装配接到 Agent 引擎上。
[[modules]]
path = "agent_runtime.config.model_providers"
depends_on = []

# 模型供应商、插件登记表与技能库都经端口查，由装配接上；那两边问「谁在用」也经它们自己的端口。
[[modules]]
path = "agent_runtime.config.agent_config"
depends_on = []

# 给应用的应用服务：经引擎的队列、历史与会话表，以及文件存储与素材台账操作会话；版本查询由组合根注入。
[[modules]]
path = "agent_runtime.service"
depends_on = [
    "agent_runtime.file_store",
    "agent_runtime.material_ledger",
    "agent_runtime.harness",
    "agent_runtime.plugins",
]

# 运行时服务的配置：YAML 与环境变量。
[[modules]]
path = "agent_runtime.settings"
depends_on = []

# 给应用的实时通道：帧的形状与按应用分发事件的集线器，应用那一侧也引用这里的帧。
[[modules]]
path = "agent_runtime.live"
depends_on = ["agent_runtime.transcript"]

# 给应用的 /v1 接口的请求体与答复体：路由与客户端库共用，不碰 Web 框架。
[[modules]]
path = "agent_runtime.app_wire"
depends_on = [
    "agent_runtime.transcript",
    "agent_runtime.file_store",
    "agent_runtime.material_ledger",
]

# 应用用的客户端库：经 HTTP 与 WebSocket 调运行时服务，只认接口与帧的形状，不碰服务端的实现。
[[modules]]
path = "agent_runtime.client"
depends_on = [
    "agent_runtime.app_wire",
    "agent_runtime.transcript",
    "agent_runtime.live",
    "agent_runtime.file_store",
    "agent_runtime.material_ledger",
]

# 回调应用：请求体的形状与按会话归属找地址发请求，应用那一侧也引用这里的请求体。
[[modules]]
path = "agent_runtime.hooks"
depends_on = ["agent_runtime.settings", "agent_runtime.transcript"]

# 运行时服务的 HTTP 入口：组合根建出三块配置的服务与运行驱动这一整套，挂上管理接口、给应用的会话接口与
# 两条 WebSocket，接上回调；插件登记表由调用方交进来。
[[modules]]
path = "agent_runtime.http"
depends_on = [
    "agent_runtime.app_wire",
    "agent_runtime.settings",
    "agent_runtime.live",
    "agent_runtime.hooks",
    "agent_runtime.config.skills",
    "agent_runtime.config.model_providers",
    "agent_runtime.config.agent_config",
    "agent_runtime.assembly",
    "agent_runtime.plugins",
    "agent_runtime.harness",
    "agent_runtime.service",
    "agent_runtime.transcript",
    "agent_runtime.file_store",
    "agent_runtime.material_ledger",
    "agent_runtime.run_deps",
]

[[modules]]
path = "agent_runtime.main"
depends_on = ["agent_runtime.http"]

# 直连数据库的管理命令：换钥。
[[modules]]
path = "agent_runtime.admin"
depends_on = ["agent_runtime.settings", "agent_runtime.config.model_providers"]

# 装配把三块配置接到引擎：按对话固定的版本装出 Agent、建供应商模型、实现 agent 配置的查询端口。
[[modules]]
path = "agent_runtime.assembly"
depends_on = [
    "agent_runtime.config.skills",
    "agent_runtime.config.model_providers",
    "agent_runtime.config.agent_config",
    "agent_runtime.harness",
    "agent_runtime.plugins",
    "agent_runtime.transcript",
]
