name: release-images

# GitHub 构建镜像，经专用代理上传到 ACR；GHCR 只保存跨版本共享的 BuildKit 构建缓存。
# 正式发布只由版本标签触发；手动运行只验证分支，不更新 latest。
permissions:
  contents: read

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false
  queue: max

env:
  REGISTRY: ${{ vars.ACR_REGISTRY }}
  NAMESPACE: ${{ vars.ACR_NAMESPACE }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      repository: ${{ steps.refs.outputs.repository }}
      tag: ${{ steps.refs.outputs.tag }}
      release: ${{ steps.refs.outputs.release }}
      commit: ${{ steps.refs.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
      - name: Check upload progress logging
        run: python3 -m unittest discover -s .github/scripts -p 'test_stream_progress.py'
      - name: Validate image references
        id: refs
        run: |
          case "$GITHUB_EVENT_NAME:$GITHUB_REF_TYPE" in
            push:tag)
              if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "::error::Release tags must use vX.Y.Z"
                echo "准备失败：版本标签必须符合 vX.Y.Z 格式。" >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
              tag=$GITHUB_REF_NAME
              release=true
              ;;
            workflow_dispatch:branch)
              tag=$(printf '%s' "$GITHUB_REF_NAME" | sed 's/[^a-zA-Z0-9_.-]/-/g')
              # 分支验证不能覆盖正式版本或 latest。
              tag="branch-$tag"
              release=false
              ;;
            *)
              echo "::error::Manual runs must select a branch; releases require a tag push"
              echo "准备失败：手动运行只能选择分支；正式发布必须推送版本标签。" >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac
          if [ "${#tag}" -gt 128 ]; then
            echo "::error::Image tag exceeds 128 characters"
            echo "准备失败：生成的镜像标签超过 128 个字符。" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
      - name: Record preparation result
        if: always()
        env:
          RESULT: ${{ job.status }}
          IMAGE_TAG: ${{ steps.refs.outputs.tag }}
          COMMIT: ${{ steps.refs.outputs.commit }}
        run: |
          {
            printf '准备结果：**%s**\n\n' "$RESULT"
            printf 'Git ref：`%s`\n\n' "$GITHUB_REF"
            printf '镜像标签：`%s`；提交：`%s`\n' "${IMAGE_TAG:-未生成}" "${COMMIT:-未解析}"
          } >> "$GITHUB_STEP_SUMMARY"

  images:
    name: images (${{ matrix.service }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: server
            context: server
            dockerfile: server/Dockerfile
          - service: web
            context: .
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3.12.0
      - name: Log in to GHCR build cache
        uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to ACR
        uses: docker/login-action@v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Install Skopeo
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends skopeo
      - name: Build image with cached layers
        id: image
        timeout-minutes: 10
        uses: docker/build-push-action@v6.18.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          # ACR 不接受默认 OCI 溯源与 SBOM 清单，使用 Docker manifest。
          # 保留压缩层摘要，上传时只传 ACR 缺少的层。
          outputs: type=oci,dest=${{ runner.temp }}/image.tar,compression=gzip,oci-mediatypes=false
          provenance: false
          sbom: false
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/iclip-${{ matrix.service }}:${{ needs.prepare.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
          cache-from: type=registry,ref=ghcr.io/${{ needs.prepare.outputs.repository }}/iclip-${{ matrix.service }}-buildcache:latest
          cache-to: type=registry,ref=ghcr.io/${{ needs.prepare.outputs.repository }}/iclip-${{ matrix.service }}-buildcache:latest,mode=max
      - name: Start ACR upload proxy
        id: proxy
        timeout-minutes: 3
        env:
          DMIT_CONFIG: ${{ secrets.ACR_DMIT_CONFIG }}
        run: |
          set -euo pipefail
          if [ -z "$DMIT_CONFIG" ]; then
            echo '::error::Missing ACR_DMIT_CONFIG secret'
            exit 1
          fi
          proxy_dir="$RUNNER_TEMP/acr-proxy"
          mkdir -m 700 "$proxy_dir"
          curl -fsSL --retry 2 \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.29/mihomo-linux-amd64-compatible-v1.19.29.gz \
            -o "$proxy_dir/mihomo.gz"
          if ! printf '%s  %s\n' \
            5612e698e96c8b8ad15abc4c0a4f098eba9234354b4f248cb97f2528e215b094 \
            "$proxy_dir/mihomo.gz" | sha256sum --check --status; then
            echo '::error::Mihomo checksum validation failed'
            exit 1
          fi
          gzip -d "$proxy_dir/mihomo.gz"
          chmod 700 "$proxy_dir/mihomo"
          umask 077
          printf '%s' "$DMIT_CONFIG" > "$proxy_dir/config.yaml"
          # 配置及原始代理日志包含节点信息，不输出到公开日志或 artifact。
          if ! "$proxy_dir/mihomo" -t -d "$proxy_dir" -f "$proxy_dir/config.yaml" > "$proxy_dir/config-check.log" 2>&1; then
            echo '::error::Invalid ACR_DMIT_CONFIG; validate it locally with Mihomo v1.19.29 -t'
            exit 1
          fi
          nohup "$proxy_dir/mihomo" -d "$proxy_dir" -f "$proxy_dir/config.yaml" > "$proxy_dir/proxy.log" 2>&1 &
          echo "$!" > "$proxy_dir/pid"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import socket
          import time
          pid = int((Path(os.environ["RUNNER_TEMP"]) / "acr-proxy/pid").read_text())
          for _ in range(40):
              try:
                  os.kill(pid, 0)
              except ProcessLookupError:
                  raise SystemExit("ACR upload proxy exited before opening its listener")
              try:
                  with socket.create_connection(("127.0.0.1", 17891), timeout=0.25):
                      break
              except OSError:
                  time.sleep(0.25)
          else:
              raise SystemExit("ACR upload proxy listener did not start")
          PY
          status=$(curl --proxy http://127.0.0.1:17891 --noproxy '' \
            --max-time 30 --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "https://$REGISTRY/v2/")
          case "$status" in
            200|401) echo 'ACR upload proxy is ready; registry TLS verified.' ;;
            *) echo "::error::ACR connectivity check through proxy returned HTTP $status"; exit 1 ;;
          esac
      - name: Push missing image layers to ACR
        id: push
        timeout-minutes: 25
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/iclip-${{ matrix.service }}:${{ needs.prepare.outputs.tag }}
          HTTP_PROXY: http://127.0.0.1:17891
          HTTPS_PROXY: http://127.0.0.1:17891
          NO_PROXY: localhost,127.0.0.1,::1
        run: |
          SECONDS=0
          export REGISTRY_AUTH_FILE="${DOCKER_CONFIG:-$HOME/.docker}/config.json"
          python3 .github/scripts/stream-progress.py \
            skopeo copy --preserve-digests --retry-times 2 \
            --digestfile "$RUNNER_TEMP/pushed-digest" \
            "oci-archive:$RUNNER_TEMP/image.tar" "docker://$IMAGE_REF"
          digest=$(cat "$RUNNER_TEMP/pushed-digest")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "seconds=$SECONDS" >> "$GITHUB_OUTPUT"
      - name: Verify ACR image digest
        id: verify
        timeout-minutes: 3
        shell: bash
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/iclip-${{ matrix.service }}:${{ needs.prepare.outputs.tag }}
          EXPECTED_DIGEST: ${{ steps.image.outputs.digest }}
          PUSHED_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          if [[ ! "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Build did not return a valid image digest"
            echo "核验失败：构建未返回有效镜像摘要。" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$PUSHED_DIGEST" != "$EXPECTED_DIGEST" ]; then
            echo "::error::Pushed digest does not match the build result"
            printf '核验失败：上传摘要与构建不一致，构建 `%s`，上传 `%s`。\n' "$EXPECTED_DIGEST" "$PUSHED_DIGEST" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if ! actual=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$IMAGE_REF" \
            | jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))'); then
            echo "::error::Unable to read a valid digest from the ACR image manifest"
            echo "核验失败：无法读取有效的 ACR 镜像摘要。" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "digest=$actual" >> "$GITHUB_OUTPUT"
          if [ "$actual" != "$EXPECTED_DIGEST" ]; then
            echo "::error::ACR digest does not match the build result"
            printf '核验失败：期望 `%s`，ACR 实际 `%s`。\n' "$EXPECTED_DIGEST" "$actual" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Stop ACR upload proxy and remove its credentials
        if: always()
        run: |
          proxy_dir="$RUNNER_TEMP/acr-proxy"
          if [ -f "$proxy_dir/pid" ]; then
            kill "$(cat "$proxy_dir/pid")" 2>/dev/null || true
          fi
          rm -rf "$proxy_dir"
      - name: Record image result
        if: always()
        env:
          RESULT: ${{ job.status }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/iclip-${{ matrix.service }}:${{ needs.prepare.outputs.tag }}
          BUILD_RESULT: ${{ steps.image.outcome }}
          PROXY_RESULT: ${{ steps.proxy.outcome }}
          PUSH_RESULT: ${{ steps.push.outcome }}
          PUSH_SECONDS: ${{ steps.push.outputs.seconds }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
          EXPECTED_DIGEST: ${{ steps.image.outputs.digest }}
          ACTUAL_DIGEST: ${{ steps.verify.outputs.digest }}
        run: |
          {
            printf '镜像：`%s`；结果：**%s**\n\n' "$IMAGE_REF" "$RESULT"
            printf '构建：%s；代理：%s；上传：%s；远端核验：%s\n\n' "$BUILD_RESULT" "$PROXY_RESULT" "$PUSH_RESULT" "$VERIFY_RESULT"
            printf '上传路径：DMIT；上传完成耗时：%s 秒（包含远端已有层检查）。\n\n' "${PUSH_SECONDS:-未完成}"
            printf '构建摘要：`%s`；ACR 摘要：`%s`\n' "${EXPECTED_DIGEST:-未返回}" "${ACTUAL_DIGEST:-未取得}"
          } >> "$GITHUB_STEP_SUMMARY"

  latest:
    name: promote latest
    needs: [prepare, images]
    if: needs.prepare.outputs.release == 'true' && needs.images.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 先取得跨版本共用的锁，再确认 main，避免旧版本重跑回退 latest。
    concurrency:
      group: release-images-latest
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Check current release commit
        id: current
        env:
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$RELEASE_COMMIT" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "跳过 latest：该版本提交不是 main 的最新提交，保留版本标签。" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install Skopeo
        if: steps.current.outputs.publish == 'true'
        run: |
          echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/registry-auth.json" >> "$GITHUB_ENV"
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends skopeo
      - name: Log in to ACR
        if: steps.current.outputs.publish == 'true'
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: printf '%s' "$ACR_PASSWORD" | skopeo login --username "$ACR_USERNAME" --password-stdin "$REGISTRY"
      - name: Promote verified version
        if: steps.current.outputs.publish == 'true'
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          trap 'printf "更新 latest 失败：服务 %s，阶段 %s。\n" "$service" "$stage" >> "$GITHUB_STEP_SUMMARY"' ERR
          for service in server web; do
            image="${REGISTRY}/${NAMESPACE}/iclip-${service}"
            stage='读取版本摘要'
            digest=$(skopeo inspect --format '{{.Digest}}' "docker://${image}:${IMAGE_TAG}")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            stage='更新 latest'
            skopeo copy --preserve-digests --retry-times 2 "docker://${image}@${digest}" "docker://${image}:latest"
            stage='核验 latest 摘要'
            actual=$(skopeo inspect --format '{{.Digest}}' "docker://${image}:latest")
            test "$actual" = "$digest"
            printf '已更新并核验 `%s:latest` → `%s`\n' "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Remove registry credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/registry-auth.json"
      - name: Record latest result
        if: always()
        env:
          RESULT: ${{ job.status }}
          PUBLISH: ${{ steps.current.outputs.publish }}
          IMAGE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          {
            printf '\nlatest 结果：**%s**\n\n' "$RESULT"
            printf '版本：`%s`；允许更新：%s\n' "$IMAGE_TAG" "${PUBLISH:-未确定}"
          } >> "$GITHUB_STEP_SUMMARY"
