name: release-images

# 推 v* 标签时构建两个镜像并推到阿里云 ACR；手动触发用于在发版前验证登录与推送。
# 公开仓：绝不在 pull_request 触发，fork 的 PR 不能碰到 ACR 凭证。
permissions:
  contents: read

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ${{ vars.ACR_REGISTRY }}
  NAMESPACE: ${{ vars.ACR_NAMESPACE }}

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iclip-server
            context: server
            dockerfile: server/Dockerfile
          - name: iclip-web
            context: .
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3.12.0
      - uses: docker/login-action@v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Image tags (标签构建打版本号 + latest；手动触发只打分支名)
        id: tags
        run: |
          image="${REGISTRY}/${NAMESPACE}/${{ matrix.name }}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tags=${image}:${GITHUB_REF_NAME},${image}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${image}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6.18.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          # 阿里云 ACR 不接受 buildx 默认附带的 OCI 溯源与 SBOM 清单（unknown manifest class）。
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
