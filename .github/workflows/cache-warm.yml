name: cache-warm

permissions:
  contents: read

# 只安装依赖、不跑检查，把 pnpm store、Playwright Chromium、中文字体、ffmpeg 安装包与 uv 缓存存到 main 上。
# main 是默认分支，所有 PR 都能恢复它存下的缓存；PR 自己存的缓存只属于该 PR，别的 PR 用不到。
# 不设路径过滤：缓存被淘汰后，下一次推送就会重建。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cache-warm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
        with:
          playwright: 'true'

  server:
    runs-on: ubuntu-latest
    # 没有能用的 ffmpeg 安装包缓存、又分到软件源慢的 runner 时，现场下载要十几分钟；中途超时缓存就存不下来。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-server
        with:
          cue-deploy-key: ${{ secrets.CUE_DEPLOY_KEY }}
      - uses: ./.github/actions/setup-ffmpeg

  video_plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-server
        with:
          working-directory: plugins/video
          cue-deploy-key: ${{ secrets.CUE_DEPLOY_KEY }}

  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-render
