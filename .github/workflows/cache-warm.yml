name: cache-warm

permissions:
  contents: read

# 只安装依赖、不跑检查，把 pnpm store、Playwright Chromium、中文字体与 uv 缓存存到 develop / main 上。
# 指向这两个分支的 PR 能恢复目标分支存下的缓存；PR 自己存的缓存只属于该 PR，别的 PR 用不到。
# 不设路径过滤：缓存被淘汰后，下一次推送就会重建。
on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: cache-warm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
        with:
          playwright: 'true'

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-server
