name: ci

# 结构：changes 判定 PR 触及哪一端；每端拆成「静态检查」与「测试」两个 job；checks 把结果映射到
# 分支保护要求的四个名称（server、server-tests、web、web-e2e），一个名称只对应一个 job，失败能直接定位。
# 新增一端时：changes 加路径分类与输出、加对应 job、checks 矩阵加一行，再到仓库设置登记保护名称。
# 已知限制：被跳过的矩阵 job 在界面上显示为字面量名称（如 `server tests (${{ matrix.suite }})`），GitHub 不展开。

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server: ${{ steps.scope.outputs.server }}
      web: ${{ steps.scope.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Docs check
        run: python3 scripts/check-docs.py
      - name: Select application checks
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          server=true
          web=true
          # 只缩小 PR 的范围；合入后全跑。纯文档不跑任何一端；公共文件和未知路径两端全跑。
          # server/ 下的 Markdown（SKILL.md 等）是运行时读取的，所以先按目录归类再看后缀。
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/ci-changed-files"; then
              server=false
              web=false
              while IFS= read -r -d '' path; do
                case "$path" in
                  server/*) scope=server ;;
                  web/*|design-system.html) scope=web ;;
                  docs/*|*.md|.claude/*|.gitignore|.pre-commit-config.yaml) scope=docs ;;
                  *) scope=all ;;
                esac
                case "$scope" in
                  server) server=true ;;
                  web) web=true ;;
                  all) server=true; web=true ;;
                esac
                printf '%-6s %s\n' "$scope" "$path"
              done < "$RUNNER_TEMP/ci-changed-files"
            else
              echo "::warning::无法确定 PR 变更范围，执行两端完整检查"
            fi
          fi
          echo "server=$server web=$web"
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"

  server_checks:
    name: server checks
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-server
      - name: Run checks
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright
          uv run tach check
          uv run pytest tests/unit -m unit

  server_tests:
    name: server tests (${{ matrix.suite }})
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: runtime
            command: >-
              uv run pytest tests/integration_no_llm/agents tests/integration_no_llm/generation
              -m integration_no_llm --durations=10
          # 根目录减去 runtime，新增测试自动纳入。
          - suite: domains
            command: >-
              uv run pytest tests/integration_no_llm
              --ignore=tests/integration_no_llm/agents --ignore=tests/integration_no_llm/generation
              -m integration_no_llm --durations=10
    services:
      # 每个分片独占一个实例。
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iclip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/iclip_test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-server
      - name: Install ffmpeg
        if: matrix.suite == 'domains'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Run tests
        run: ${{ matrix.command }}
      - name: Contract check
        if: matrix.suite == 'domains'
        run: uv run python scripts/dump_openapi.py --check
      - name: Migration check
        if: matrix.suite == 'domains'
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/iclip_test
        run: uv run alembic upgrade head

  web_checks:
    name: web checks (${{ matrix.task }})
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: static
            command: pnpm ci:static && pnpm build
          - task: tests
            command: pnpm test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      - name: Run checks
        run: ${{ matrix.command }}

  web_e2e:
    name: web e2e (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
        with:
          playwright: 'true'
      # playwright.config.ts 在 CI 下先做 mock 构建再起 preview，见该文件说明。
      - name: Run e2e
        run: pnpm test:e2e --shard=${{ matrix.shard }}/2
      # 失败或重试过的用例留有 trace（retain-on-failure），全绿时目录里只有 .last-run.json，不上传。
      - name: Upload Playwright traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-${{ matrix.shard }}
          path: |
            web/test-results
            !web/test-results/.last-run.json
          if-no-files-found: ignore
          retention-days: 7

  # 分支保护只认这四个名称；被 changes 跳过的一端在这里按「应跳过且已跳过」放行。
  checks:
    name: ${{ matrix.name }}
    if: always()
    needs: [changes, server_checks, server_tests, web_checks, web_e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            scope: server
            job: server_checks
          - name: server-tests
            scope: server
            job: server_tests
          - name: web
            scope: web
            job: web_checks
          - name: web-e2e
            scope: web
            job: web_e2e
    steps:
      - name: Require selected check
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs[matrix.scope] }}
          RESULT: ${{ needs[matrix.job].result }}
        run: |
          echo "changes=$SCOPE_RESULT required=$REQUIRED ${{ matrix.job }}=$RESULT"
          test "$SCOPE_RESULT" = success
          if [ "$REQUIRED" = true ]; then
            test "$RESULT" = success
          else
            test "$REQUIRED" = false
            test "$RESULT" = skipped
          fi
