name: ci
run-name: >-
  ${{ github.event.action == 'edited' && github.event.changes.base == null && format('PR #{0} metadata only - checks not run', github.event.pull_request.number) || format('PR #{0} checks for {1}', github.event.pull_request.number, github.base_ref) }}

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# 修改目标分支会重新检查；标题、正文编辑使用独立组，避免取消正在执行的检查。
concurrency:
  group: ci-${{ github.ref }}-${{ github.event.action == 'edited' && github.event.changes.base == null && 'metadata' || 'checks' }}
  cancel-in-progress: true

jobs:
  scope:
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server: ${{ steps.scope.outputs.server }}
      web: ${{ steps.scope.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check documentation
        run: python3 scripts/check-docs.py
      - name: Select application checks
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          server=true
          web=true
          # 只有 develop PR 按路径缩小范围；main 和其他目标分支都完整检查。
          if [ "$BASE_REF" = develop ]; then
            if git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/ci-changed-files"; then
              server=false
              web=false
              while IFS= read -r -d '' path; do
                # server/ 下的 Markdown 是运行时输入，目录规则优先于文档后缀。
                case "$path" in
                  server/*) scope=server ;;
                  web/*|design-system.html) scope=web ;;
                  docs/*|*.md|.claude/*|.gitignore|.pre-commit-config.yaml) scope=docs ;;
                  *) scope=all ;;
                esac
                case "$scope" in
                  server) server=true ;;
                  web) web=true ;;
                  all) server=true; web=true ;;
                esac
                printf '%-6s %s\n' "$scope" "$path"
              done < "$RUNNER_TEMP/ci-changed-files"
            else
              echo "::warning::无法确定 PR 变更范围，执行两端完整检查"
            fi
          fi
          echo "base=$BASE_REF server=$server web=$web"
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"

  server_checks:
    name: server-check
    needs: scope
    if: needs.scope.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-server
      - name: Lint Python
        run: uv run ruff check .
      - name: Check Python formatting
        run: uv run ruff format --check .
      - name: Check Python types
        run: uv run pyright
      - name: Check dependency boundaries
        run: uv run tach check
      - name: Run unit tests
        run: uv run pytest tests/unit -m unit

  server_tests:
    name: server-tests (${{ matrix.suite }})
    needs: scope
    if: needs.scope.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: runtime
            command: >-
              uv run pytest tests/integration_no_llm/agents tests/integration_no_llm/generation
              -m integration_no_llm --durations=10
          - suite: domains-1
            command: >-
              uv run pytest tests/integration_no_llm/identity tests/integration_no_llm/conversations
              tests/integration_no_llm/collections
              -m integration_no_llm --durations=10
          # 其余目录全部进入这一组，新测试不会因分组遗漏。
          - suite: domains-2
            command: >-
              uv run pytest tests/integration_no_llm
              --ignore=tests/integration_no_llm/agents --ignore=tests/integration_no_llm/generation
              --ignore=tests/integration_no_llm/identity --ignore=tests/integration_no_llm/conversations
              --ignore=tests/integration_no_llm/collections
              -m integration_no_llm --durations=10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iclip_test
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/iclip_test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-server
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Run integration tests
        run: ${{ matrix.command }}
      - name: Check OpenAPI contract
        if: matrix.suite == 'domains-2'
        run: uv run python scripts/dump_openapi.py --check
      - name: Check migrations
        if: matrix.suite == 'domains-2'
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/iclip_test
        run: uv run alembic upgrade head

  web_checks:
    name: web-check
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      - name: Check frontend static rules
        run: pnpm ci:static
      - name: Check types and build production frontend
        run: pnpm build

  web_unit:
    name: web-unit (${{ matrix.shard }}/4)
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      - name: Run frontend unit tests
        run: pnpm test --shard=${{ matrix.shard }}/4

  web_e2e:
    name: web-e2e (${{ matrix.shard }}/4)
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
        with:
          playwright: 'true'
      # 每片使用独立 mock 服务；只有 E2E 安装浏览器。
      - name: Run end-to-end tests
        run: pnpm test:e2e --workers=2 --shard=${{ matrix.shard }}/4
      - name: Upload Playwright traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-${{ matrix.shard }}
          path: |
            web/test-results
            !web/test-results/.last-run.json
          if-no-files-found: ignore
          retention-days: 7

  ci:
    # GitHub 将 skipped check 视为通过；元信息编辑使用不同名称，不能替代真正的 ci。
    name: ${{ github.event.action == 'edited' && github.event.changes.base == null && 'ci not run (metadata only)' || 'ci' }}
    if: always() && (github.event.action != 'edited' || github.event.changes.base != null)
    needs: [scope, server_checks, server_tests, web_checks, web_unit, web_e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject cancelled workflow
        if: cancelled()
        run: |
          echo '::error::Workflow was cancelled'
          echo 'CI result: **cancelled**' >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Summarize and require selected checks
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          SERVER_REQUIRED: ${{ needs.scope.outputs.server }}
          SERVER_CHECK_RESULT: ${{ needs.server_checks.result }}
          SERVER_TEST_RESULT: ${{ needs.server_tests.result }}
          WEB_REQUIRED: ${{ needs.scope.outputs.web }}
          WEB_CHECK_RESULT: ${{ needs.web_checks.result }}
          WEB_UNIT_RESULT: ${{ needs.web_unit.result }}
          WEB_E2E_RESULT: ${{ needs.web_e2e.result }}
        run: |
          {
            printf 'PR head: `%s`\n\n' "$HEAD_SHA"
            printf 'Checked merge commit: `%s`\n\n' "$MERGE_SHA"
            printf 'Target branch: `%s`\n\n' "$BASE_REF"
            if [ "$BASE_REF" = develop ]; then
              printf '检查模式：按变更范围。`Required=false` 表示本次变更未涉及该端；具体路径判定见 scope 日志。\n\n'
            else
              printf '检查模式：完整检查 server 和 web。\n\n'
            fi
            printf '| Job | Required | Result |\n| --- | --- | --- |\n'
            printf '| scope | true | %s |\n' "$SCOPE_RESULT"
            printf '| server-check | %s | %s |\n' "$SERVER_REQUIRED" "$SERVER_CHECK_RESULT"
            printf '| server-tests (3 groups) | %s | %s |\n' "$SERVER_REQUIRED" "$SERVER_TEST_RESULT"
            printf '| web-check | %s | %s |\n' "$WEB_REQUIRED" "$WEB_CHECK_RESULT"
            printf '| web-unit (4 shards) | %s | %s |\n' "$WEB_REQUIRED" "$WEB_UNIT_RESULT"
            printf '| web-e2e (4 shards) | %s | %s |\n' "$WEB_REQUIRED" "$WEB_E2E_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"

          require_result() {
            local job=$1 required=$2 result=$3
            case "$required:$result" in
              true:success|false:skipped) return 0 ;;
              *) echo "::error::$job required=$required result=$result"; return 1 ;;
            esac
          }

          failed=0
          if [ "$SCOPE_RESULT" != success ]; then
            echo "::error::scope result=$SCOPE_RESULT"
            failed=1
          fi
          require_result server-check "$SERVER_REQUIRED" "$SERVER_CHECK_RESULT" || failed=1
          require_result server-tests "$SERVER_REQUIRED" "$SERVER_TEST_RESULT" || failed=1
          require_result web-check "$WEB_REQUIRED" "$WEB_CHECK_RESULT" || failed=1
          require_result web-unit "$WEB_REQUIRED" "$WEB_UNIT_RESULT" || failed=1
          require_result web-e2e "$WEB_REQUIRED" "$WEB_E2E_RESULT" || failed=1
          if [ "$failed" -ne 0 ]; then
            echo 'CI result: **failed**' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo 'CI result: **passed**' >> "$GITHUB_STEP_SUMMARY"
