name: ci

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server: ${{ steps.scope.outputs.server }}
      web: ${{ steps.scope.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Docs check
        run: python3 scripts/check-docs.py
      - name: Select application checks
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          server=true
          web=true
          # 只缩小 PR 的范围；合入后全跑，公共文件和未知路径也全跑。
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/ci-changed-files"; then
              server=false
              web=false
              while IFS= read -r -d '' path; do
                case "$path" in
                  server/*) server=true ;;
                  web/*) web=true ;;
                  *) server=true; web=true ;;
                esac
              done < "$RUNNER_TEMP/ci-changed-files"
            else
              echo "::warning::无法确定 PR 变更范围，执行两端完整检查"
            fi
          fi
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"

  server:
    name: server (${{ matrix.suite }})
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.suite == 'checks' && 15 || 30 }}
    defaults:
      run:
        working-directory: server
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: checks
            command: |
              uv run ruff check .
              uv run ruff format --check .
              uv run pyright
              uv run tach check
              uv run pytest tests/unit -m unit
          - suite: runtime
            command: >-
              uv run pytest tests/integration_no_llm/agents tests/integration_no_llm/generation
              -m integration_no_llm --durations=10
          # 根目录减去 runtime，新增测试自动纳入。
          - suite: domains
            command: >-
              uv run pytest tests/integration_no_llm
              --ignore=tests/integration_no_llm/agents --ignore=tests/integration_no_llm/generation
              -m integration_no_llm --durations=10
    services:
      postgres:
        # 静态检查不启动数据库；集成分片各自独占一个实例。
        image: ${{ matrix.suite != 'checks' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iclip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/iclip_test
    steps:
      - uses: actions/checkout@v7
      # setup-uv 不提供浮动大版本标签。
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --locked
      - name: Install ffmpeg
        if: matrix.suite == 'domains'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Run checks
        run: ${{ matrix.command }}
      - name: Contract check
        if: matrix.suite == 'domains'
        run: uv run python scripts/dump_openapi.py --check
      - name: Migration check
        if: matrix.suite == 'domains'
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/iclip_test
        run: uv run alembic upgrade head

  web:
    name: web (${{ matrix.task }})
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.browser && 20 || 15 }}
    defaults:
      run:
        working-directory: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: static
            command: pnpm ci:static && pnpm build
          - task: tests
            command: pnpm test
          - task: e2e-1
            browser: true
            command: pnpm test:e2e --shard=1/2
          - task: e2e-2
            browser: true
            command: pnpm test:e2e --shard=2/2
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        # 使用 packageManager 指定的完整发布包，避免 npm 引导安装。
        run: |
          version=$(sed -n 's/.*"packageManager": "pnpm@\(.*\)".*/\1/p' package.json)
          mkdir -p "$HOME/.pnpm-bin"
          curl -fsSL "https://github.com/pnpm/pnpm/releases/download/v${version}/pnpm-linux-x64.tar.gz" | tar -xz -C "$HOME/.pnpm-bin"
          chmod +x "$HOME/.pnpm-bin/pnpm"
          echo "$HOME/.pnpm-bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        if: matrix.browser
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | sed 's/^Version //')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: matrix.browser
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browser
        if: matrix.browser && steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system deps
        if: matrix.browser && steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Run checks
        run: ${{ matrix.command }}

  # 同一应用的检查统一汇总，保留四个分支保护名称。
  checks:
    name: ${{ matrix.name }}
    if: always()
    needs: [changes, server, web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            scope: server
          - name: server-tests
            scope: server
          - name: web
            scope: web
          - name: web-e2e
            scope: web
    steps:
      - name: Require selected checks
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs[matrix.scope] }}
          RESULT: ${{ needs[matrix.scope].result }}
        run: |
          test "$SCOPE_RESULT" = success
          if [ "$REQUIRED" = true ]; then
            test "$RESULT" = success
          else
            test "$REQUIRED" = false
            test "$RESULT" = skipped
          fi
