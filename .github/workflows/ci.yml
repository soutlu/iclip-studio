name: ci
run-name: >-
  ${{ github.event.action == 'edited' && github.event.changes.base == null && format('PR #{0} metadata only - checks not run', github.event.pull_request.number) || format('PR #{0} checks for {1}', github.event.pull_request.number, github.base_ref) }}

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# 修改目标分支会重新检查；标题、正文编辑使用独立组，避免取消正在执行的检查。
concurrency:
  group: ci-${{ github.ref }}-${{ github.event.action == 'edited' && github.event.changes.base == null && 'metadata' || 'checks' }}
  cancel-in-progress: true

jobs:
  secrets:
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        # 与 pre-commit 固定同一版本；扫描所有祖先和合并提交，不能只看最终 diff。
        run: |
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --config=/repo/.gitleaks.toml --redact=100 --verbose \
            --ignore-gitleaks-allow --log-opts="--full-history --diff-merges=first-parent HEAD"

  scope:
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
      video_plugins: ${{ steps.scope.outputs.video_plugins }}
      server: ${{ steps.scope.outputs.server }}
      web: ${{ steps.scope.outputs.web }}
      web_format: ${{ steps.scope.outputs.web_format }}
      render: ${{ steps.scope.outputs.render }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check documentation
        run: python3 scripts/check-docs.py
      - name: Select application checks
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          runtime=true
          video_plugins=true
          server=true
          web=true
          web_format=false
          render=true
          # 只有 develop PR 按路径缩小范围；main 和其他目标分支都完整检查。
          if [ "$BASE_REF" = develop ]; then
            if git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/ci-changed-files"; then
              runtime=false
              video_plugins=false
              server=false
              web=false
              render=false
              while IFS= read -r -d '' path; do
                # server/ 下的 Markdown 是运行时输入，目录规则优先于文档后缀；
                # web/ 下的 Markdown 不是运行时输入，只查 prettier 格式。
                case "$path" in
                  server/*) scope=server ;;
                  runtime/*.md) scope=docs ;;
                  runtime/*) scope=runtime ;;
                  plugins/*.md) scope=docs ;;
                  plugins/*) scope=video_plugins ;;
                  render/*.md) scope=docs ;;
                  render/*) scope=render ;;
                  web/*.md) scope=format ;;
                  web/*|design-system.html) scope=web ;;
                  docs/*|*.md|.claude/*|.gitignore|.pre-commit-config.yaml) scope=docs ;;
                  *) scope=all ;;
                esac
                case "$scope" in
                  # 视频插件依赖 runtime，后端依赖两者：runtime 变了三处都查，插件变了插件与后端都查。
                  runtime) runtime=true; video_plugins=true; server=true ;;
                  video_plugins) video_plugins=true; server=true ;;
                  server) server=true ;;
                  web) web=true ;;
                  render) render=true ;;
                  format) web_format=true ;;
                  all) runtime=true; video_plugins=true; server=true; web=true; render=true ;;
                esac
                # 渲染服务打包 web 的成片合成构建与后端合同的 zod 生成物，测试用 web 组装的测试组件库，
                # 它们变了也要查渲染服务。
                case "$path" in
                  web/src/features/storyboard/whole-film/composition/*|web/scripts/hyperframes-*|web/src/shared/api/generated/*)
                    render=true ;;
                esac
                printf '%-6s %s\n' "$scope" "$path"
              done < "$RUNNER_TEMP/ci-changed-files"
            else
              echo "::warning::无法确定 PR 变更范围，执行两端完整检查"
            fi
          fi
          # 完整前端检查已包含格式检查。
          if [ "$web" = true ]; then
            web_format=false
          fi
          echo "base=$BASE_REF runtime=$runtime video_plugins=$video_plugins server=$server web=$web web_format=$web_format render=$render"
          {
            echo "runtime=$runtime"
            echo "video_plugins=$video_plugins"
            echo "server=$server"
            echo "web=$web"
            echo "web_format=$web_format"
            echo "render=$render"
          } >> "$GITHUB_OUTPUT"

  runtime_static:
    name: runtime-static
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-server
        with:
          working-directory: runtime
      - name: Lint Python
        run: uv run ruff check .
      - name: Check Python formatting
        run: uv run ruff format --check .
      - name: Check Python types
        run: uv run pyright
      - name: Check dependency boundaries
        run: uv run tach check

  runtime_unit:
    name: runtime-unit
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-server
        with:
          working-directory: runtime
      - name: Run unit tests
        run: uv run pytest tests/unit

  video_plugins_static:
    name: video-plugins-static
    needs: scope
    if: needs.scope.outputs.video_plugins == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/video
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-server
        with:
          working-directory: plugins/video
      - name: Lint Python
        run: uv run ruff check .
      - name: Check Python formatting
        run: uv run ruff format --check .
      - name: Check Python types
        run: uv run pyright
      - name: Check dependency boundaries
        run: uv run tach check

  video_plugins_unit:
    name: video-plugins-unit
    needs: scope
    if: needs.scope.outputs.video_plugins == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/video
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-server
        with:
          working-directory: plugins/video
      - name: Run unit tests
        run: uv run pytest tests/unit

  server_static:
    name: server-static
    needs: scope
    if: needs.scope.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-server
      - name: Lint Python
        run: uv run ruff check .
      - name: Check Python formatting
        run: uv run ruff format --check .
      - name: Check Python types
        run: uv run pyright
      - name: Check dependency boundaries
        run: uv run tach check

  server_unit:
    name: server-unit
    needs: scope
    if: needs.scope.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-server
      - name: Run unit tests
        run: uv run pytest tests/unit -m unit

  server_integration:
    name: server-integration (${{ matrix.group }})
    needs: scope
    if: needs.scope.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 每组独占一个 runner 和 Postgres；用例会清表，同一数据库内仍串行执行。
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: agents
            tests: tests/integration_no_llm/agents
          - group: application
            tests: tests/integration_no_llm --ignore=tests/integration_no_llm/agents
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iclip_test
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/iclip_test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-server
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Run integration tests
        run: uv run pytest ${{ matrix.tests }} -m integration_no_llm --durations=10
      # 合同导出会装配媒体能力，需要本 job 已安装的 ffmpeg。
      - name: Check OpenAPI contract
        if: matrix.group == 'application'
        run: uv run python scripts/dump_openapi.py --check
      - name: Check migrations
        if: matrix.group == 'application'
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/iclip_test
        run: uv run alembic upgrade head

  web_static:
    name: web-static
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      - name: Check frontend static rules
        run: pnpm ci:static

  web_build:
    name: web-build
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      # build 包含 tsc -b，不单独执行 typecheck。
      - name: Check types and build production frontend
        run: pnpm build

  web_unit:
    name: web-unit (${{ matrix.shard }}/4)
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      - name: Run frontend unit tests
        run: pnpm test --shard=${{ matrix.shard }}/4

  web_e2e:
    name: web-e2e (${{ matrix.shard }}/4)
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
        with:
          playwright: 'true'
      # 每片自行构建 mock 并启动 preview；生产构建由 web-build 独立验证。
      - name: Run end-to-end tests
        run: pnpm test:e2e --shard=${{ matrix.shard }}/4
      - name: Upload Playwright traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            web/test-results
            !web/test-results/.last-run.json
          if-no-files-found: ignore
          retention-days: 7

  web_format:
    name: web-format
    needs: scope
    if: needs.scope.outputs.web_format == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      - name: Check frontend formatting
        run: pnpm format:check

  render_static:
    name: render-static
    needs: scope
    if: needs.scope.outputs.render == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: render
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-render
      - name: Lint and check formatting
        run: pnpm lint
      - name: Check types
        run: pnpm typecheck
      - name: Bundle
        run: pnpm build

  render_unit:
    name: render-unit
    needs: scope
    if: needs.scope.outputs.render == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: render
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-render
      # 测试读 web 组装好的测试组件库（组装要用 web 依赖里的 HyperFrames 运行时）。
      - uses: ./.github/actions/setup-web
      - name: Assemble test component library
        working-directory: web
        run: pnpm hf:registry
      # 真实渲染的集成测试还要 chrome-headless-shell 与 ffmpeg，runner 上没有，按用例名里的原因跳过；
      # 它在本机验证。
      - name: Run unit tests
        run: pnpm test

  ci:
    # GitHub 将 skipped check 视为通过；元信息编辑使用不同名称，不能替代真正的 ci。
    name: ${{ github.event.action == 'edited' && github.event.changes.base == null && 'ci not run (metadata only)' || 'ci' }}
    if: always() && (github.event.action != 'edited' || github.event.changes.base != null)
    needs:
      - scope
      - secrets
      - runtime_static
      - runtime_unit
      - video_plugins_static
      - video_plugins_unit
      - server_static
      - server_unit
      - server_integration
      - web_static
      - web_build
      - web_unit
      - web_e2e
      - web_format
      - render_static
      - render_unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject cancelled workflow
        if: cancelled()
        run: |
          echo '::error::Workflow was cancelled'
          echo 'CI 结果：**cancelled**' >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Summarize and require selected checks
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
          RUNTIME_REQUIRED: ${{ needs.scope.outputs.runtime }}
          RUNTIME_STATIC_RESULT: ${{ needs.runtime_static.result }}
          RUNTIME_UNIT_RESULT: ${{ needs.runtime_unit.result }}
          VIDEO_PLUGINS_REQUIRED: ${{ needs.scope.outputs.video_plugins }}
          VIDEO_PLUGINS_STATIC_RESULT: ${{ needs.video_plugins_static.result }}
          VIDEO_PLUGINS_UNIT_RESULT: ${{ needs.video_plugins_unit.result }}
          SERVER_REQUIRED: ${{ needs.scope.outputs.server }}
          SERVER_STATIC_RESULT: ${{ needs.server_static.result }}
          SERVER_UNIT_RESULT: ${{ needs.server_unit.result }}
          SERVER_INTEGRATION_RESULT: ${{ needs.server_integration.result }}
          WEB_REQUIRED: ${{ needs.scope.outputs.web }}
          WEB_STATIC_RESULT: ${{ needs.web_static.result }}
          WEB_BUILD_RESULT: ${{ needs.web_build.result }}
          WEB_UNIT_RESULT: ${{ needs.web_unit.result }}
          WEB_E2E_RESULT: ${{ needs.web_e2e.result }}
          WEB_FORMAT_REQUIRED: ${{ needs.scope.outputs.web_format }}
          WEB_FORMAT_RESULT: ${{ needs.web_format.result }}
          RENDER_REQUIRED: ${{ needs.scope.outputs.render }}
          RENDER_STATIC_RESULT: ${{ needs.render_static.result }}
          RENDER_UNIT_RESULT: ${{ needs.render_unit.result }}
        run: |
          {
            printf 'PR 最新提交：%s\n\n' "$HEAD_SHA"
            printf '检查的合并提交：%s\n\n' "$MERGE_SHA"
            printf '目标分支：%s\n\n' "$BASE_REF"
            if [ "$BASE_REF" = develop ]; then
              printf '检查模式：按变更范围。「需执行」为 false 表示本次变更不需要该检查；具体路径判定见 scope 日志。\n\n'
            else
              printf '检查模式：完整检查 runtime、plugins/video、server、web 和 render。\n\n'
            fi
            printf '| Job | 需执行 | 结果 |\n| --- | --- | --- |\n'
            printf '| scope | true | %s |\n' "$SCOPE_RESULT"
            printf '| secrets | true | %s |\n' "$SECRETS_RESULT"
            printf '| runtime-static | %s | %s |\n' "$RUNTIME_REQUIRED" "$RUNTIME_STATIC_RESULT"
            printf '| runtime-unit | %s | %s |\n' "$RUNTIME_REQUIRED" "$RUNTIME_UNIT_RESULT"
            printf '| video-plugins-static | %s | %s |\n' "$VIDEO_PLUGINS_REQUIRED" "$VIDEO_PLUGINS_STATIC_RESULT"
            printf '| video-plugins-unit | %s | %s |\n' "$VIDEO_PLUGINS_REQUIRED" "$VIDEO_PLUGINS_UNIT_RESULT"
            printf '| server-static | %s | %s |\n' "$SERVER_REQUIRED" "$SERVER_STATIC_RESULT"
            printf '| server-unit | %s | %s |\n' "$SERVER_REQUIRED" "$SERVER_UNIT_RESULT"
            printf '| server-integration（2 组） | %s | %s |\n' "$SERVER_REQUIRED" "$SERVER_INTEGRATION_RESULT"
            printf '| web-static | %s | %s |\n' "$WEB_REQUIRED" "$WEB_STATIC_RESULT"
            printf '| web-build | %s | %s |\n' "$WEB_REQUIRED" "$WEB_BUILD_RESULT"
            printf '| web-unit（4 片） | %s | %s |\n' "$WEB_REQUIRED" "$WEB_UNIT_RESULT"
            printf '| web-e2e（4 片） | %s | %s |\n' "$WEB_REQUIRED" "$WEB_E2E_RESULT"
            printf '| web-format | %s | %s |\n' "$WEB_FORMAT_REQUIRED" "$WEB_FORMAT_RESULT"
            printf '| render-static | %s | %s |\n' "$RENDER_REQUIRED" "$RENDER_STATIC_RESULT"
            printf '| render-unit | %s | %s |\n' "$RENDER_REQUIRED" "$RENDER_UNIT_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"

          require_result() {
            local job=$1 required=$2 result=$3
            case "$required:$result" in
              true:success|false:skipped) return 0 ;;
              *) echo "::error::$job required=$required result=$result"; return 1 ;;
            esac
          }

          failed=0
          if [ "$SCOPE_RESULT" != success ]; then
            echo "::error::scope result=$SCOPE_RESULT"
            failed=1
          fi
          require_result secrets true "$SECRETS_RESULT" || failed=1
          require_result runtime-static "$RUNTIME_REQUIRED" "$RUNTIME_STATIC_RESULT" || failed=1
          require_result runtime-unit "$RUNTIME_REQUIRED" "$RUNTIME_UNIT_RESULT" || failed=1
          require_result video-plugins-static "$VIDEO_PLUGINS_REQUIRED" "$VIDEO_PLUGINS_STATIC_RESULT" || failed=1
          require_result video-plugins-unit "$VIDEO_PLUGINS_REQUIRED" "$VIDEO_PLUGINS_UNIT_RESULT" || failed=1
          require_result server-static "$SERVER_REQUIRED" "$SERVER_STATIC_RESULT" || failed=1
          require_result server-unit "$SERVER_REQUIRED" "$SERVER_UNIT_RESULT" || failed=1
          require_result server-integration "$SERVER_REQUIRED" "$SERVER_INTEGRATION_RESULT" || failed=1
          require_result web-static "$WEB_REQUIRED" "$WEB_STATIC_RESULT" || failed=1
          require_result web-build "$WEB_REQUIRED" "$WEB_BUILD_RESULT" || failed=1
          require_result web-unit "$WEB_REQUIRED" "$WEB_UNIT_RESULT" || failed=1
          require_result web-e2e "$WEB_REQUIRED" "$WEB_E2E_RESULT" || failed=1
          require_result web-format "$WEB_FORMAT_REQUIRED" "$WEB_FORMAT_RESULT" || failed=1
          require_result render-static "$RENDER_REQUIRED" "$RENDER_STATIC_RESULT" || failed=1
          require_result render-unit "$RENDER_REQUIRED" "$RENDER_UNIT_RESULT" || failed=1
          if [ "$failed" -ne 0 ]; then
            echo 'CI 结果：**failed**' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo 'CI 结果：**passed**' >> "$GITHUB_STEP_SUMMARY"
