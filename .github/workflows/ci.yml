name: ci

# 公开仓最小权限：CI 只需读代码，防止 fork PR 借 token 写仓库
permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iclip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 显式配置测试库，连接失败时测试报错而非跳过。
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/iclip_test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      # 上游不提供浮动的大版本标签，须使用完整版本号。
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Sync dependencies (lockfile 精确 pin)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Typecheck
        run: uv run pyright
      - name: Architecture graph
        run: uv run tach check
      - name: Default test gate (real Postgres)
        run: uv run pytest -m "unit or integration_no_llm"
      - name: Install ffmpeg (导出合同要把整个 app 装配起来，shot_video 启动时检查它)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Contract check (openapi.json 与后端一致)
        run: uv run python scripts/dump_openapi.py --check
      - name: Docs check (链接与 make 目标存在)
        run: python3 ../scripts/check-docs.py
      - name: Alembic to head against service Postgres
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/iclip_test
        run: uv run alembic upgrade head

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        # 从发布页下载 packageManager 指定版本，避免额外的 npm 引导安装。
        run: |
          version=$(sed -n 's/.*"packageManager": "pnpm@\(.*\)".*/\1/p' package.json)
          mkdir -p "$HOME/.pnpm-bin"
          # 启动器依赖同目录 dist/，须解压完整发布包。
          curl -fsSL "https://github.com/pnpm/pnpm/releases/download/v${version}/pnpm-linux-x64.tar.gz" | tar -xz -C "$HOME/.pnpm-bin"
          chmod +x "$HOME/.pnpm-bin/pnpm"
          echo "$HOME/.pnpm-bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: ci:check
        run: pnpm ci:check
      - name: Build
        run: pnpm build
      # e2e 需要浏览器与开发服务器，在 ci:check 之外单独执行。
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: e2e (browser MSW as backend)
        run: pnpm test:e2e
