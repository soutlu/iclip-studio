name: ci

# 公开仓最小权限：CI 只需读代码，防止 fork PR 借 token 写仓库
permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:

# 同一分支再推一次就取消上一轮，不排队等旧结果。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 静态检查、单元测试、合同与文档：不需要数据库，几十秒跑完。
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      # 上游不提供浮动的大版本标签，须使用完整版本号。
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Sync dependencies (lockfile 精确 pin)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Typecheck
        run: uv run pyright
      - name: Architecture graph
        run: uv run tach check
      - name: Unit tests
        run: uv run pytest -m unit
      - name: Install ffmpeg (导出合同装配 app 时 shot_video 检查它)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Contract check (openapi.json 与后端一致)
        run: uv run python scripts/dump_openapi.py --check
      - name: Docs check (链接与 make 目标存在)
        run: python3 ../scripts/check-docs.py

  # 要真 Postgres 的集成用例与迁移，和上面并行跑。
  server-tests:
    runs-on: ubuntu-latest
    # 单测挂死时的最后一道闸；单个用例的上限见 pyproject 的 pytest timeout。
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iclip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 显式配置测试库，连接失败时测试报错而非跳过。
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/iclip_test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Sync dependencies (lockfile 精确 pin)
        run: uv sync --locked
      - name: Install ffmpeg (媒体用例要真取帧切格)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Integration tests (real Postgres)
        run: uv run pytest -m integration_no_llm
      - name: Alembic to head against service Postgres
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/iclip_test
        run: uv run alembic upgrade head

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        # 从发布页下载 packageManager 指定版本，避免额外的 npm 引导安装。
        run: |
          version=$(sed -n 's/.*"packageManager": "pnpm@\(.*\)".*/\1/p' package.json)
          mkdir -p "$HOME/.pnpm-bin"
          # 启动器依赖同目录 dist/，须解压完整发布包。
          curl -fsSL "https://github.com/pnpm/pnpm/releases/download/v${version}/pnpm-linux-x64.tar.gz" | tar -xz -C "$HOME/.pnpm-bin"
          chmod +x "$HOME/.pnpm-bin/pnpm"
          echo "$HOME/.pnpm-bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: ci:check
        run: pnpm ci:check
      - name: Build
        run: pnpm build

  # e2e 要浏览器与开发服务器，单独一个作业和 ci:check 并行；浏览器按 Playwright 版本缓存。
  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        run: |
          version=$(sed -n 's/.*"packageManager": "pnpm@\(.*\)".*/\1/p' package.json)
          mkdir -p "$HOME/.pnpm-bin"
          curl -fsSL "https://github.com/pnpm/pnpm/releases/download/v${version}/pnpm-linux-x64.tar.gz" | tar -xz -C "$HOME/.pnpm-bin"
          chmod +x "$HOME/.pnpm-bin/pnpm"
          echo "$HOME/.pnpm-bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | sed 's/^Version //')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browser
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system deps (浏览器已缓存)
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: e2e (browser MSW as backend)
        run: pnpm test:e2e
