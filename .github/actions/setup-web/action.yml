name: setup-web
description: 安装 pnpm、Node 与 web 依赖；按需准备带缓存的 Playwright Chromium。

inputs:
  playwright:
    description: 为 true 时安装 Playwright Chromium 与中文字体。
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install pnpm
      # 使用 packageManager 指定的完整发布包，避免 npm 引导安装。
      shell: bash
      working-directory: web
      run: |
        version=$(sed -n 's/.*"packageManager": "pnpm@\(.*\)".*/\1/p' package.json)
        mkdir -p "$HOME/.pnpm-bin"
        curl -fsSL "https://github.com/pnpm/pnpm/releases/download/v${version}/pnpm-linux-x64.tar.gz" | tar -xz -C "$HOME/.pnpm-bin"
        chmod +x "$HOME/.pnpm-bin/pnpm"
        echo "$HOME/.pnpm-bin" >> "$GITHUB_PATH"
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: web/pnpm-lock.yaml
    - run: pnpm install --frozen-lockfile
      shell: bash
      working-directory: web
    - name: Playwright version
      if: inputs.playwright == 'true'
      id: playwright
      shell: bash
      working-directory: web
      run: echo "version=$(pnpm exec playwright --version | sed 's/^Version //')" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      if: inputs.playwright == 'true'
      id: browsers
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    - name: Install Playwright browser
      if: inputs.playwright == 'true' && steps.browsers.outputs.cache-hit != 'true'
      shell: bash
      working-directory: web
      run: pnpm exec playwright install chromium
    # 中文字体准备策略：
    # 1. 不跑 playwright install-deps（runner 已随 Chrome 装齐系统库，install-deps 会拉取大量无关外文字体）。
    # 2. 不用 apt-get install（常在等待 dpkg 锁时卡顿 1～2.5 分钟），改用 apt-get download + dpkg-deb 免锁解包到用户字体目录。
    # 3. 缓存 key 只固定上游版本号 0.9.45，跨不同 Ubuntu 包修订号（如 0.9.45-8、0.9.45-8build1）共用同一份字体缓存。
    - uses: actions/cache@v4
      if: inputs.playwright == 'true'
      id: cjk-font
      with:
        path: ~/.local/share/fonts/wqy-zenhei
        key: cjk-font-${{ runner.os }}-fonts-wqy-zenhei-0.9.45
    - name: Download CJK font
      if: inputs.playwright == 'true' && steps.cjk-font.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -u
        dir="$HOME/.local/share/fonts/wqy-zenhei"
        work=$(mktemp -d)
        cd "$work"
        version=$(apt-cache policy fonts-wqy-zenhei | sed -n 's/^ *Candidate: //p')
        case "$version" in
          0.9.45-*) ;;
          *)
            echo "::error::fonts-wqy-zenhei 的候选版本是 ${version:-（没有）}，不是 0.9.45：缓存 key 里的版本号要一起改"
            exit 1
            ;;
        esac
        apt-get download "fonts-wqy-zenhei=$version"
        dpkg-deb -x fonts-wqy-zenhei_*.deb root
        mkdir -p "$dir"
        find root -type f \( -name '*.ttc' -o -name '*.ttf' \) -exec cp {} "$dir/" \;
        if [ -z "$(ls -A "$dir")" ]; then
          echo "::error::fonts-wqy-zenhei 包里没有找到字体文件"
          exit 1
        fi
    - name: Register CJK font
      if: inputs.playwright == 'true'
      shell: bash
      run: |
        fc-cache -f "$HOME/.local/share/fonts/wqy-zenhei"
        if [ -z "$(fc-list 'WenQuanYi Zen Hei' family)" ]; then
          echo "::error::fontconfig 没有识别到文泉驿正黑"
          exit 1
        fi
