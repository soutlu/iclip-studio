name: setup-web
description: 安装 pnpm、Node 与 web 依赖；按需准备带缓存的 Playwright Chromium。

inputs:
  playwright:
    description: 为 true 时安装 Playwright Chromium 与中文字体。
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install pnpm
      # 使用 packageManager 指定的完整发布包，避免 npm 引导安装。
      shell: bash
      working-directory: web
      run: |
        version=$(sed -n 's/.*"packageManager": "pnpm@\(.*\)".*/\1/p' package.json)
        mkdir -p "$HOME/.pnpm-bin"
        curl -fsSL "https://github.com/pnpm/pnpm/releases/download/v${version}/pnpm-linux-x64.tar.gz" | tar -xz -C "$HOME/.pnpm-bin"
        chmod +x "$HOME/.pnpm-bin/pnpm"
        echo "$HOME/.pnpm-bin" >> "$GITHUB_PATH"
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: web/pnpm-lock.yaml
    - run: pnpm install --frozen-lockfile
      shell: bash
      working-directory: web
    - name: Playwright version
      if: inputs.playwright == 'true'
      id: playwright
      shell: bash
      working-directory: web
      run: echo "version=$(pnpm exec playwright --version | sed 's/^Version //')" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      if: inputs.playwright == 'true'
      id: browsers
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    - name: Install Playwright browser
      if: inputs.playwright == 'true' && steps.browsers.outputs.cache-hit != 'true'
      shell: bash
      working-directory: web
      run: pnpm exec playwright install chromium
    # 不跑 install-deps：它每次 apt-get update 再装一串用不到的外文字体，约 30s。浏览器要的系统库
    # runner 镜像随 Chrome 已经装齐，缺库时 Playwright 启动会报出库名；镜像没有中文字体，只补这一个。
    # 这个包多年未变，镜像自带的软件源索引就能装，不必 apt-get update。
    - name: Install CJK font
      if: inputs.playwright == 'true'
      shell: bash
      run: sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
