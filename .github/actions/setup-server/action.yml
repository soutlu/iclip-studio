name: setup-server
description: 安装 uv 并按锁文件同步一个 Python 项目（server、runtime 或 plugins/video）的依赖。

inputs:
  working-directory:
    description: 要同步的项目目录
    required: false
    default: server

runs:
  using: composite
  steps:
    # setup-uv 不提供浮动大版本标签。
    - uses: astral-sh/setup-uv@v10.0.1
    - run: uv sync --locked
      shell: bash
      working-directory: ${{ inputs.working-directory }}
