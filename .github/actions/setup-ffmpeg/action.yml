name: setup-ffmpeg
description: 缓存 Ubuntu 官方安装包，离线安装并验证 ffmpeg 与 ffprobe。

runs:
  using: composite
  steps:
    - name: Identify runner image
      id: image
      shell: bash
      run: |
        printf 'platform=%s-%s\n' "${ImageOS:?}" "$(dpkg --print-architecture)" >> "$GITHUB_OUTPUT"
        printf 'version=%s\n' "${ImageVersion:?}" >> "$GITHUB_OUTPUT"
    # ffmpeg 依赖集取决于 runner 预装系统库，缓存键按镜像版本区分；未精确命中时回退复用同平台其他镜像版本的 deb 缓存离线安装，
    # 离线安装失败再回退现场下载（部分 runner 软件源较慢，下载约需十余分钟）。
    - uses: actions/cache/restore@v4
      id: packages
      with:
        path: ~/.cache/ffmpeg-debs/*.deb
        key: ffmpeg-debs-${{ steps.image.outputs.platform }}-${{ hashFiles('.github/actions/setup-ffmpeg/action.yml') }}-${{ steps.image.outputs.version }}
        restore-keys: |
          ffmpeg-debs-${{ steps.image.outputs.platform }}-${{ hashFiles('.github/actions/setup-ffmpeg/action.yml') }}-
    - name: Install ffmpeg packages
      id: install
      shell: bash
      run: |
        archives="$HOME/.cache/ffmpeg-debs"
        mkdir -p "$archives"
        install_cached() {
          sudo apt-get install -y -qq --no-install-recommends --no-download \
            -o Dir::Cache::archives="$archives" "$archives"/*.deb
        }
        if compgen -G "$archives/*.deb" > /dev/null && install_cached; then
          echo "downloaded=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "::notice::未命中可直接安装的 ffmpeg 缓存，回退现场下载"
        rm -f "$archives"/*.deb
        # 现场下载保留标准输出，便于在软件源缓慢时观察进度与速率
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends --download-only \
          -o Dir::Cache::archives="$archives" ffmpeg
        install_cached
        echo "downloaded=true" >> "$GITHUB_OUTPUT"
    # 仅在触发了现场下载时写入新缓存（跨镜像版本回退安装成功时无需重复保存相同 deb 包）
    - uses: actions/cache/save@v4
      if: steps.install.outputs.downloaded == 'true'
      with:
        path: ~/.cache/ffmpeg-debs/*.deb
        key: ${{ steps.packages.outputs.cache-primary-key }}
    - name: Verify media tools
      shell: bash
      run: |
        ffmpeg -hide_banner -version
        ffprobe -hide_banner -version
