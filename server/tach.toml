source_roots = ["src"]

[[modules]]
path = "iclip.common"
depends_on = []

[[modules]]
path = "iclip.platform.db"
depends_on = []

[[modules]]
path = "iclip.platform.http"
depends_on = ["iclip.common"]

[[modules]]
path = "iclip.platform.paging"
depends_on = ["iclip.common"]

[[modules]]
path = "iclip.platform.object_store"
depends_on = []

[[modules]]
path = "iclip.platform.media"
depends_on = ["iclip.common"]

[[modules]]
path = "iclip.platform.outbound"
depends_on = []

[[modules]]
path = "iclip.config"
depends_on = ["iclip.common"]

[[modules]]
path = "iclip.domains.identity"
depends_on = ["iclip.common", "iclip.platform.db", "iclip.platform.http"]

[[modules]]
path = "iclip.domains.agents"
depends_on = ["iclip.common", "iclip.domains.identity", "iclip.platform.live"]

[[modules]]
path = "iclip.domains.conversations"
depends_on = [
    "iclip.common",
    "iclip.platform.db",
    "iclip.platform.paging",
    "iclip.domains.identity",
]

[[modules]]
path = "iclip.domains.collections"
depends_on = [
    "iclip.common",
    "iclip.platform.db",
    "iclip.platform.paging",
    "iclip.domains.identity",
]

[[modules]]
path = "iclip.domains.tasks"
depends_on = ["iclip.common", "iclip.platform.paging", "iclip.domains.identity"]

# 审计报表是跨模块的只读读模型，按表名直接查，不依赖各业务模块。
[[modules]]
path = "iclip.domains.audit"
depends_on = ["iclip.common", "iclip.platform.paging", "iclip.domains.identity"]

# 资料库同样是跨模块的只读读模型，按表名直接查；爆款素材库的条目与标签经 tagging 写。
[[modules]]
path = "iclip.domains.library"
depends_on = [
    "iclip.common",
    "iclip.platform.paging",
    "iclip.domains.identity",
    "iclip.domains.tagging",
]

# 埋点核对主语资格时按表名读生成记录，不依赖生成域。
[[modules]]
path = "iclip.domains.tracking"
depends_on = ["iclip.common", "iclip.domains.identity"]

[[modules]]
path = "iclip.domains.uploads"
depends_on = [
    "iclip.common",
    "iclip.platform.media",
    "iclip.platform.object_store",
    "iclip.platform.outbound",
    "iclip.domains.identity",
]

[[modules]]
path = "iclip.domains.generation"
depends_on = [
    "iclip.common",
    "iclip.platform.db",
    "iclip.platform.http",
    "iclip.platform.media",
    "iclip.platform.object_store",
    "iclip.platform.paging",
    "iclip.domains.identity",
]

# 资料库标签：取打标文字与打标都是端口，由组合根接到各库与插件包上；条数按表名读参考视频的移除标记。
[[modules]]
path = "iclip.domains.tagging"
depends_on = ["iclip.common", "iclip.domains.identity"]

# 参考视频的拆解、上传记录都是端口，由组合根接到插件包与生成域上；标签经 tagging。
[[modules]]
path = "iclip.domains.references"
depends_on = [
    "iclip.common",
    "iclip.platform.paging",
    "iclip.domains.identity",
    "iclip.domains.tagging",
]

# 品牌资源的视频上传记录、视频与字体探测是端口，由组合根接上；生成域不依赖它。
[[modules]]
path = "iclip.domains.brand_templates"
depends_on = ["iclip.common", "iclip.platform.media", "iclip.platform.object_store", "iclip.domains.identity"]

# 技能库、模型供应商与 agent 配置的业务在运行时（agent_runtime.config），这里只留接口路由。
[[modules]]
path = "iclip.domains.model_providers"
depends_on = ["iclip.domains.identity"]

[[modules]]
path = "iclip.domains.skills"
depends_on = ["iclip.domains.identity"]

[[modules]]
path = "iclip.domains.agent_config"
depends_on = ["iclip.domains.identity"]

[[modules]]
path = "iclip.domains.products"
depends_on = ["iclip.common"]

[[modules]]
path = "iclip.domains.inspirations"
depends_on = ["iclip.common", "iclip.domains.identity", "iclip.domains.products"]

[[modules]]
path = "iclip.platform.live"
depends_on = ["iclip.common"]

[[modules]]
path = "iclip.plugins"
depends_on = [
    "iclip.common",
    "iclip.platform.media",
]

[[modules]]
path = "iclip.app"
depends_on = [
    "iclip.common",
    "iclip.platform.db",
    "iclip.platform.http",
    "iclip.platform.object_store",
    "iclip.platform.media",
    "iclip.platform.outbound",
    "iclip.config",
    "iclip.domains.identity",
    "iclip.domains.agents",
    "iclip.domains.uploads",
    "iclip.domains.conversations",
    "iclip.domains.generation",
    "iclip.domains.inspirations",
    "iclip.domains.products",
    "iclip.domains.collections",
    "iclip.domains.tasks",
    "iclip.domains.audit",
    "iclip.domains.library",
    "iclip.domains.references",
    "iclip.domains.tagging",
    "iclip.domains.brand_templates",
    "iclip.domains.tracking",
    "iclip.domains.skills",
    "iclip.domains.model_providers",
    "iclip.domains.agent_config",
    "iclip.plugins",
]
