source_roots = ["src"]

[[modules]]
path = "iclip.common"
depends_on = []

[[modules]]
path = "iclip.platform.db"
depends_on = []

[[modules]]
path = "iclip.platform.http"
depends_on = ["iclip.common"]

# 公开对象存储：只认识 OSS SDK 与 stdlib，不认识业务。
[[modules]]
path = "iclip.platform.object_store"
depends_on = []

# 命名空间化文本文件存储：工作区能力把它暴露给模型，别的能力往同一处落文件也
# 走它。只认识 SQL 与 stdlib，命名空间按什么分由调用方决定。
[[modules]]
path = "iclip.platform.file_store"
depends_on = []

[[modules]]
path = "iclip.config"
depends_on = ["iclip.common"]

[[modules]]
path = "iclip.domains.identity"
depends_on = ["iclip.common", "iclip.platform.db", "iclip.platform.http"]

# agent 运行的 HTTP 面：只认识注入进来的事件流工厂，不认识 harness。
[[modules]]
path = "iclip.domains.agents"
depends_on = ["iclip.domains.identity"]

# 对话：自有的表。不认识 agent 引擎，也不认识工作区——删对话要连带清掉的那些东西
# 由组合根接线进来（见 domains/conversations/service.py 的 PurgeDerived）。
[[modules]]
path = "iclip.domains.conversations"
depends_on = ["iclip.common", "iclip.domains.identity"]

# 创作需求单：自有的表。全公司可见的工作队列，不认识任何别的业务模块——款号快照要的
# 产品资料与对象存储由组合根按 ports.py 的窄协议接进来。
[[modules]]
path = "iclip.domains.tasks"
depends_on = ["iclip.common", "iclip.domains.identity"]

# 素材账本：自有的表 + 公开桶（直传签名、登记时回桶里核实）。
[[modules]]
path = "iclip.domains.assets"
depends_on = [
    "iclip.common",
    "iclip.platform.object_store",
    "iclip.domains.identity",
]

# 媒体生成：自有的表 + 两家外部生成接口 + 后台推进器。
[[modules]]
path = "iclip.domains.generation"
depends_on = [
    "iclip.common",
    "iclip.platform.db",
    "iclip.platform.object_store",
    "iclip.domains.identity",
]

# 产品资料查询：读外部的 PDM 同步副本，自己不建表。
[[modules]]
path = "iclip.domains.products"
depends_on = ["iclip.common", "iclip.domains.identity"]

# 爆款视频查询：读外部的数仓爆款榜，自己不建表。
[[modules]]
path = "iclip.domains.inspirations"
depends_on = ["iclip.common", "iclip.domains.identity"]

# 通用 agent 内核，不认识业务。
[[modules]]
path = "iclip.harness"
depends_on = ["iclip.common"]

# capability 实现，唯一同时认识 harness 与 domains 的适配环。
[[modules]]
path = "iclip.capabilities"
depends_on = [
    "iclip.common",
    "iclip.platform.file_store",
    "iclip.harness",
    "iclip.domains.identity",
    "iclip.domains.agents",
]

# 组合根：唯一可以 import 一切的地方。
[[modules]]
path = "iclip.app"
depends_on = [
    "iclip.common",
    "iclip.platform.db",
    "iclip.platform.http",
    "iclip.platform.object_store",
    "iclip.platform.file_store",
    "iclip.config",
    "iclip.domains.identity",
    "iclip.domains.agents",
    "iclip.domains.assets",
    "iclip.domains.conversations",
    "iclip.domains.generation",
    "iclip.domains.inspirations",
    "iclip.domains.products",
    "iclip.domains.tasks",
    "iclip.harness",
    "iclip.capabilities",
]
