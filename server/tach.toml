source_roots = ["src"]

[[modules]]
path = "iclip.common"
depends_on = []

[[modules]]
path = "iclip.platform.db"
depends_on = []

[[modules]]
path = "iclip.platform.http"
depends_on = ["iclip.common"]

[[modules]]
path = "iclip.config"
depends_on = ["iclip.common"]

[[modules]]
path = "iclip.domains.identity"
depends_on = ["iclip.common", "iclip.platform.db", "iclip.platform.http"]

# agent 运行的 HTTP 面：只认识注入进来的事件流工厂，不认识 harness。
[[modules]]
path = "iclip.domains.agents"
depends_on = ["iclip.domains.identity"]

# 通用 agent 内核，不认识业务。
[[modules]]
path = "iclip.harness"
depends_on = ["iclip.common"]

# 业务能力包，唯一同时认识 harness 与 domains 的适配环。
[[modules]]
path = "iclip.capabilities"
depends_on = ["iclip.common", "iclip.harness", "iclip.domains.identity"]

# 组合根：唯一可以 import 一切的地方。
[[modules]]
path = "iclip.app"
depends_on = [
    "iclip.common",
    "iclip.platform.db",
    "iclip.platform.http",
    "iclip.config",
    "iclip.domains.identity",
    "iclip.domains.agents",
    "iclip.harness",
    "iclip.capabilities",
]
