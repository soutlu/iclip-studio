# OpenAPI 合同导出（scripts/dump_openapi.py）使用的占位配置：启用全部可选段以导出完整路由；真实配置不入库。
# 服务地址、名称与功能开关均在此维护，配置对应段或字段即启用相应功能；.env 仅存放敏感凭证。
app:
  name: iclip-studio

db:
  schema: iclip

security:
  session_lifetime_seconds: 604800
  cookie_secure: false
  cors_allow_origins: []

# 配置此段即挂载 /auth/sso/* 路由。
sso:
  app_name: iclip
  base_url: https://placeholder.invalid/sso
  redirect_url: https://placeholder.invalid/auth/sso/callback
  pms_base_url: https://placeholder.invalid/pms # 可选；配置后 SSO 登录时从 PMS 同步城市、职位与部门
  root_email: root@placeholder.invalid # 可选；该邮箱首次通过 SSO 登录时自动授予 root 角色
  oauth_name: sso # 可选，默认 sso

# 配置此段即启用对象存储；须在 .env 中设置 OSS_ACCESS_KEY_ID 与 OSS_ACCESS_KEY_SECRET。
object_store:
  bucket: placeholder
  endpoint: https://placeholder.invalid
  public_url_base: https://placeholder.invalid/public
  internal_endpoint: https://placeholder-internal.invalid # 可选；同地域内网读写地址，仅填写 scheme 与 host

# 配置此段即启用媒体生成路由与后台队列；须同时配置 object_store 与 model_groups.default。
media_generation:
  video:
    submit_url: https://placeholder.invalid/video/submit
    status_base_url: https://placeholder.invalid/video/status
    model: vendor-b-seedance-2-5 # 默认模型，显式指定 vendor-b 前缀以固定供应商
    # 仅声明允许使用的模型白名单；模型是否支持视频编辑等能力由代码侧按模型名判定。
    allowed_models:
      - vendor-b-seedance-2-5-flash
      - vendor-b-seedance-2-5
      - wan3.0-video-prime
    # 配置此项即开通样片功能（先生成 480p 样片，完成后转为 1080p）；支持样片的模型由代码侧按模型名判定，状态查询复用 status_base_url。
    draft_complete_url: https://placeholder.invalid/video/draft/complete
    # 配置此段即启用高清版（超分）；状态查询复用 status_base_url，密钥与 model_id 取自各配置组。
    enhance:
      submit_url: https://placeholder.invalid/video/enhance
      model: video-enhance
      resolutions: [1080p, 720p] # 可选超分档位，按从高到低排列（上游仅支持 720p 与 1080p）
      fps: 30 # 目标帧率（15–60）；省略则不插帧
  image:
    api_base: https://placeholder.invalid/image
    env: prod # 网关结合调用方标识校验环境合法性
    # 默认任务路径后缀（拼接于各模型地址后）：无参考图走文生图，含参考图走图像编辑。
    text_to_image_task: text-to-image
    image_edit_task: image-edit
    default: nano_banana_pro # 请求未指定 model 时使用的默认模型
    # 键名为落库 provider 名，route 拼接于 api_base 后；
    # concurrency 为该模型的单进程提交并发上限（各模型独立队列，互不阻塞）。
    models:
      nano_banana_pro:
        route: nano-banana-pro
        concurrency: 40
      seedream_v5_pro:
        route: seedrance5.0pro # 上游路径沿用其公开契约拼写 seedrance
        concurrency: 40
      gpt-image-2.5:
        route: openai/gpt-image-2.5-flare-developer
        concurrency: 10
        # 覆盖默认任务路径后缀。
        text_to_image_task: text-to-image
        image_edit_task: edit
  poll_interval_seconds: 5 # 状态查询固定轮询间隔（秒）
  job_timeout_seconds: 3600 # 提交后等待终态的超时上限（秒）
  # 单进程本地合成并发数；省略时按启动期探测结果默认取值（硬件加速 4，软件编码 2）
  # compose_concurrency: 4
  subtitle:
    # 配置此段即启用素材片字幕识别（固定模型 qwen-audio-3.1-asr-flash），各配置组须声明 subtitle_api_key_env。
    url: https://placeholder.invalid/api/v1/services/aigc/multimodal-generation/generation
    concurrency: 4 # 单进程识别队列并发数
    timeout_seconds: 120 # 单次识别请求超时时间（秒）
  music:
    # 配置此段即启用生成背景音乐（固定模型 qwen-audio-3.1-tts-next），各配置组须声明 music_api_key_env。
    url: https://placeholder.invalid/api/v1/services/audio/tts/SpeechSynthesizer
    concurrency: 2 # 单进程生成队列并发数
    timeout_seconds: 300 # 单次生成请求超时时间（秒）
  speech:
    # 配置此段即启用 final-cut 配音与旁白（固定模型 qwen-audio-3.1-tts-next），各配置组须声明 speech_api_key_env。
    url: https://placeholder.invalid/api/v1/services/audio/tts/SpeechSynthesizer
    concurrency: 2 # 单进程配音队列并发数
    timeout_seconds: 120 # 单句合成请求超时时间（秒）

# 按配置组声明媒体生成密钥（填写环境变量名）及「产品模型名 → 网关 model_id」映射。
# default 为未分组用户的保留组，启用媒体生成时必填；各组 video_models 的键集合须与 allowed_models（启用高清版时含 enhance.model）完全一致。
model_groups:
  default:
    video_api_key_env: VIDEO_API_KEY
    subtitle_api_key_env: QWEN_SUBTITLE_API_KEY
    music_api_key_env: QWEN_MUSIC_API_KEY
    speech_api_key_env: QWEN_SPEECH_API_KEY
    video_models:
      vendor-b-seedance-2-5-flash: vendor-b-seedance-2-5-flash
      vendor-b-seedance-2-5: vendor-b-seedance-2-5
      wan3.0-video-prime: wan3.0-video-prime
      video-enhance: video-enhance

# 配置此段即启用视频拆解（video_breakdown 与参考视频后台拆解）及资料库 AI 打标；须确保 PATH 中存在 ffmpeg，
# 并在管理后台的火山方舟供应商中启用对应固定模型。
# breakdown_concurrency 为单进程参考视频拆解并发数（多进程按进程数倍增；省略时硬件 4、软件 2）。
iclip_studio: {}

# 配置此段即向运行时 shot_video 插件开放抽帧与生图内部接口；须同时启用 media_generation、object_store
# 且 PATH 中存在 ffmpeg（出图重试策略位于运行时配置 plugins.config.shot_video）。
shot_video: {}

# 配置此段即启用产品资料库查询（爆款视频按款号降级）；须在 .env 中设置只读连接串 PRODUCT_CATALOG_DATABASE_URL。
product_catalog: {}

final_cut:
  # 配置后即启用成片导出（转发至该地址的渲染服务）；须同时配置 object_store 与 media_generation。
  render_url: https://placeholder.invalid/render
  # 配置 final-cut 独立预览域名（格式 http(s)://主机[:端口]，不含路径）；未配置时编辑器预览无法加载。
  preview_origin: https://preview.placeholder.invalid

# 运行时服务地址（必填）；鉴权密钥取自 .env 的 RUNTIME_APP_KEY。
runtime:
  url: https://placeholder.invalid/runtime

ops:
  log_level: INFO
