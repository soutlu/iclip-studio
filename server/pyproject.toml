[project]
name = "iclip"
version = "0.1.0"
description = "iClip Agent 后端：FastAPI 宿主 + PydanticAI 运行内核"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "structlog>=24",
    "fastapi-users[sqlalchemy]>=14",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.15",
    "pyyaml>=6",
    "httpx>=0.27",
    "pydantic-ai-slim[openai]>=2.39",  # OpenAI 兼容端点（含百炼）
    # 0.x 的 minor 版本可能破坏 API；导入边界见 ADR-0001 §6
    "pydantic-ai-harness>=0.29",
    "oss2>=2.19",  # 阿里云 OSS 官方 SDK：生成结果转存公开对象
    "procrastinate==3.9.0",  # Postgres 生成任务队列；固定版本以匹配迁移中的 DDL
    # binary extra 提供 libpq，支持未安装系统 libpq 的环境。
    "psycopg[binary,pool]>=3.2",
    # ImageFont.load_default(size=...) 需要 Pillow 10.1 及以上版本。
    "pillow>=10.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "asgi-lifespan>=2",
    "testcontainers[postgres]>=4",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "tach>=0.20",
    "pre-commit>=4.6.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iclip"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "TID251"]
# RUF001/002/003：中文全角标点是本仓文案约定，不是笔误。
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

# 日志统一由 app/logging.py 配置。
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logging.getLogger".msg = "日志走 structlog：_logger = structlog.stdlib.get_logger(__name__)"
"structlog.get_logger".msg = "用带类型的 structlog.stdlib.get_logger(__name__)"

[tool.ruff.lint.per-file-ignores]
"src/iclip/app/logging.py" = ["TID251"]
"tests/**" = ["TID251"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
include = ["src", "tests", "scripts"]
# 第三方库（fastapi-users / sqlalchemy / testcontainers）无完整类型导出产生的 Unknown 噪音；
# 结构性 strict 检查全部保留。
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportMissingTypeStubs = false
# FastAPI 路由处理器是装饰器注册的闭包，无法被静态分析识别为已使用。
reportUnusedFunction = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: 纯逻辑与进程内契约（默认门禁）",
    "integration_no_llm: 无 LLM 的集成面，identity 域使用真实 Postgres（默认门禁）",
    "integration_llm: 真实模型（外部门禁）",
    "e2e_full: 全链路（外部门禁）",
    "external: 依赖外部凭证（外部门禁）",
]
