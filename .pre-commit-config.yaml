repos:
  - repo: local
    hooks:
      - id: server-ruff-check
        name: server ruff check --fix
        entry: bash -c 'cd server && uv run ruff check --fix .'
        language: system
        pass_filenames: false
        files: ^server/
      - id: server-ruff-format
        name: server ruff format
        entry: bash -c 'cd server && uv run ruff format .'
        language: system
        pass_filenames: false
        files: ^server/
      - id: web-lint-staged
        name: web lint-staged
        entry: bash -c 'cd web && pnpm lint-staged'
        language: system
        pass_filenames: false
        files: ^web/
  # pre-push 运行 pyright；完整检查由 CI 执行。
  - repo: local
    hooks:
      - id: server-typecheck-push
        name: server pyright (pre-push)
        entry: bash -c 'cd server && uv run pyright'
        language: system
        pass_filenames: false
        stages: [pre-push]
