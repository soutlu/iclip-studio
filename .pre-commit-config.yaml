repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit]
        args: [--config=.gitleaks.toml, --ignore-gitleaks-allow]
  - repo: local
    hooks:
      - id: python-ruff-check
        name: server + runtime + plugins/video ruff check --fix
        entry: bash -c 'cd server && uv run ruff check --fix . && cd ../runtime && uv run ruff check --fix . && cd ../plugins/video && uv run ruff check --fix .'
        language: system
        pass_filenames: false
        files: ^(server|runtime|plugins)/
      - id: python-ruff-format
        name: server + runtime + plugins/video ruff format
        entry: bash -c 'cd server && uv run ruff format . && cd ../runtime && uv run ruff format . && cd ../plugins/video && uv run ruff format .'
        language: system
        pass_filenames: false
        files: ^(server|runtime|plugins)/
      - id: web-lint-staged
        name: web lint-staged
        entry: bash -c 'cd web && pnpm lint-staged'
        language: system
        pass_filenames: false
        files: ^web/
  # pre-push 运行 pyright；完整检查由 CI 执行。
  - repo: local
    hooks:
      - id: server-typecheck-push
        name: server pyright (pre-push)
        entry: bash -c 'cd server && uv run pyright'
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: runtime-typecheck-push
        name: runtime pyright (pre-push)
        entry: bash -c 'cd runtime && uv run pyright'
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: video-plugins-typecheck-push
        name: plugins/video pyright (pre-push)
        entry: bash -c 'cd plugins/video && uv run pyright'
        language: system
        pass_filenames: false
        stages: [pre-push]
