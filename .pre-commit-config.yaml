# 没写 stages 的钩子只在提交时跑；推送时只跑下面标了 pre-push 的 pyright。
default_stages: [pre-commit]
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit]
        args: [--config=.gitleaks.toml, --ignore-gitleaks-allow]
  # ruff 只处理暂存的 Python 文件。每个项目用自己虚拟环境里的 ruff，在项目目录里按项目内路径运行，
  # 与 make lint / make format-check 用同一份配置；--force-exclude 让配置里的排除规则对显式传入的文件也生效。
  - repo: local
    hooks:
      - id: server-ruff-check
        name: server ruff check --fix
        entry: bash -c 'cd server && uv run ruff check --fix --force-exclude "${@#server/}"' --
        language: system
        types_or: [python, pyi]
        files: ^server/
      - id: video-plugins-ruff-check
        name: plugins/video ruff check --fix
        entry: bash -c 'cd plugins/video && uv run ruff check --fix --force-exclude "${@#plugins/video/}"' --
        language: system
        types_or: [python, pyi]
        files: ^plugins/video/
      - id: server-ruff-format
        name: server ruff format
        entry: bash -c 'cd server && uv run ruff format --force-exclude "${@#server/}"' --
        language: system
        types_or: [python, pyi]
        files: ^server/
      - id: video-plugins-ruff-format
        name: plugins/video ruff format
        entry: bash -c 'cd plugins/video && uv run ruff format --force-exclude "${@#plugins/video/}"' --
        language: system
        types_or: [python, pyi]
        files: ^plugins/video/
      - id: web-lint-staged
        name: web lint-staged
        entry: bash -c 'cd web && pnpm lint-staged'
        language: system
        pass_filenames: false
        files: ^web/
      - id: web-design-guard
        name: web design-guard
        entry: bash -c 'cd web && node scripts/design-guard.mjs'
        language: system
        pass_filenames: false
        files: ^web/src/.*\.(css|ts|tsx)$
  # pre-push：仅在推送改动涉及 Python 代码或 runtime.ref 时运行对应项目的 pyright
  # （server 依赖 plugins/video，两边改动均触发 server 检查）；其余检查由 CI 执行。
  - repo: local
    hooks:
      - id: server-typecheck-push
        name: server pyright (pre-push)
        entry: bash -c 'cd server && uv run pyright'
        language: system
        pass_filenames: false
        files: ^(server|plugins/video)/|^runtime\.ref$
        stages: [pre-push]
      - id: video-plugins-typecheck-push
        name: plugins/video pyright (pre-push)
        entry: bash -c 'cd plugins/video && uv run pyright'
        language: system
        pass_filenames: false
        files: ^plugins/video/|^runtime\.ref$
        stages: [pre-push]
