<!--
  Grid Pixelate Wipe — transition effect.

  来源：HyperFrames 组件库 grid-pixelate-wipe，https://github.com/heygen-com/hyperframes （v0.8.168），
  Apache License 2.0（http://www.apache.org/licenses/LICENSE-2.0），Copyright HeyGen。

  本文件对原组件的改动（原组件是要自己写时间线的代码片段）：
  1. 改成 <template> 子合成，按原文件末尾的时间线写法自带时间线，挂在成片的一个切点上：
     前一半格子从中心向外盖满画面（切点在正中，此时画面全被盖住），后一半从四周向里揭开。
  2. 原定时长 1.2 秒（原写法的每格 0.6 秒加错开 0.6 秒），盖住与揭开各占一半，
     每格动画与错开总量各占半程的一半；成片里的时长由宿主的播放速率换算。
-->
<template id="grid-pixelate-wipe-template">
  <div id="grid-pixelate-root" data-composition-id="grid-pixelate-wipe">
    <div id="grid-pixelate-overlay"></div>
    <style>
      #grid-pixelate-root {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      #grid-pixelate-overlay {
        --grid-color: black;
        position: absolute;
        inset: 0;
        display: grid;
        pointer-events: none;
      }

      #grid-pixelate-overlay .grid-cell {
        background: var(--grid-color);
        transform: scale(0);
        transform-origin: center center;
      }
    </style>
    <script>
      ;(function () {
        var COLS = 16
        var ROWS = 9
        var DURATION = 1.2
        var overlay = document.getElementById('grid-pixelate-overlay')

        overlay.style.gridTemplateColumns = 'repeat(' + COLS + ', 1fr)'
        overlay.style.gridTemplateRows = 'repeat(' + ROWS + ', 1fr)'
        for (var i = 0; i < COLS * ROWS; i++) {
          var cell = document.createElement('div')
          cell.className = 'grid-cell'
          overlay.appendChild(cell)
        }
        var cells = overlay.querySelectorAll('.grid-cell')

        var half = DURATION / 2
        var step = half / 2
        var tl = gsap.timeline({ paused: true })
        tl.to(
          cells,
          {
            scale: 1,
            duration: step,
            stagger: { amount: step, from: 'center' },
            ease: 'power2.inOut',
          },
          0,
        )
        tl.to(
          cells,
          {
            scale: 0,
            duration: step,
            stagger: { amount: step, from: 'edges' },
            ease: 'power2.inOut',
          },
          half,
        )
        tl.set({}, {}, DURATION)

        window.__timelines = window.__timelines || {}
        window.__timelines['grid-pixelate-wipe'] = tl
      })()
    </script>
  </div>
</template>
