<!--
  Texture — 纹理字幕：一次一个词，字面上流动着纹理。

  来源：HyperFrames 组件库 caption-texture，https://github.com/heygen-com/hyperframes （v0.8.168），
  Apache License 2.0（http://www.apache.org/licenses/LICENSE-2.0），Copyright HeyGen。

  本文件对原组件的改动：
  1. 改成 <template> 子合成；台词来自 window.__hyperframes.getVariables().words
     （[{ text, start, end, sentence }]，成片秒数），去掉写死的台词与重点词。
  2. 去掉转大写；中文用 Noto Sans SC（本地字体文件），拉丁字母仍用 Anton。
  3. 尺寸按所在画面等比缩放：原组件按 1920×1080 设计，这里用容器单位换算（短边 1080 对应 100cqmin）；
     字号照原组件用画布量字，收进画面宽的 90%。
  4. 每个词写上所在句子的 data-hf-id="caption:<sentence>"，编辑器在画面上按它认出点中的是哪一句。
  texture 变量、入场与纹理流动的动画不变。
-->
<template id="caption-texture-template">
  <div
    id="caption-texture"
    data-composition-id="caption-texture"
    data-timeline-locked
    data-start="0"
    data-composition-variables='[{"id":"texture","type":"string","label":"Texture","default":"lava"}]'
  >
    <link rel="stylesheet" href="../../vendor/fonts/883ae2fa2d9f.css" />
    <link rel="stylesheet" href="../../vendor/fonts/noto-sans-sc.css" />
    <div id="lv-container"></div>
    <style>
      #caption-texture {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        background: transparent;
        container-type: size;
      }

      #caption-texture #lv-container {
        --u: calc(100cqmin / 1080);
        position: absolute;
        inset: 0;
        z-index: 10;
        pointer-events: none;
      }

      #caption-texture .hf-texture-text {
        color: #fff;
        -webkit-mask-size: var(--mask-size, cover);
        mask-size: var(--mask-size, cover);
        -webkit-mask-position: var(--mask-position, center);
        mask-position: var(--mask-position, center);
        -webkit-mask-mode: luminance;
        mask-mode: luminance;
        filter: contrast(var(--mask-contrast, 1));
      }

      #caption-texture .lv-texture-override {
        -webkit-mask-size: 200% 200%;
        mask-size: 200% 200%;
        -webkit-mask-position: 0% 50%;
        mask-position: 0% 50%;
        -webkit-mask-mode: luminance;
        mask-mode: luminance;
        filter: contrast(1.2);
      }

      #caption-texture .lv-shadow {
        position: absolute;
        left: 0;
        width: 100%;
        text-align: center;
        top: 50%;
        filter: drop-shadow(0 calc(4 * var(--u)) calc(24 * var(--u)) rgba(255, 100, 20, 0.55));
        opacity: 0;
        visibility: hidden;
      }

      #caption-texture .lv-word {
        font-family: 'Anton', 'Noto Sans SC', sans-serif;
        font-weight: 700;
        font-synthesis: none;
        color: #ffd0a0;
        display: inline-block;
        letter-spacing: 0.04em;
        line-height: 1.1;
        white-space: nowrap;
      }
    </style>
    <script>
      ;(function () {
        window.__timelines = window.__timelines || {}

        var vars =
          window.__hyperframes && window.__hyperframes.getVariables
            ? window.__hyperframes.getVariables()
            : {}
        var TEXTURE = vars.texture || 'lava'
        var TEXTURE_URL = 'compositions/components/' + TEXTURE + '.png'
        var LETTER_SPACING = 0.04

        // 量一个词的宽度（以字号为单位）：字体与 .lv-word 一致（Anton 只有 400 一种字重，不合成粗体）；
        // 画布不算字距，按每字 0.04em 补上。
        var measureContext = document.createElement('canvas').getContext('2d')
        measureContext.font = "400 100px 'Anton', 'Noto Sans SC', sans-serif"
        function widthInEm(text) {
          return (
            measureContext.measureText(text).width / 100 + Array.from(text).length * LETTER_SPACING
          )
        }

        var WORDS = (Array.isArray(vars.words) ? vars.words : [])
          .map(function (word) {
            var start = Number(word.start) || 0
            return {
              text: String(word.text || '').trim(),
              start: start,
              end: Math.max(start, Number(word.end) || 0),
              sentence: word.sentence,
            }
          })
          .filter(function (word) {
            return word.text.length > 0
          })

        var container = document.getElementById('lv-container')
        var tl = gsap.timeline({ paused: true })
        var wordEls = []

        WORDS.forEach(function (w, wi) {
          var shadow = document.createElement('div')
          shadow.className = 'lv-shadow'
          shadow.id = 'lv-shadow-' + wi
          gsap.set(shadow, { yPercent: -50 })

          var wordEl = document.createElement('div')
          wordEl.className = 'hf-texture-text lv-texture-override lv-word'
          wordEl.id = 'lv-word-' + wi
          wordEl.setAttribute('data-hf-id', 'caption:' + w.sentence)
          wordEl.textContent = w.text
          wordEls.push(wordEl)
          wordEl.style.webkitMaskImage = "url('" + TEXTURE_URL + "')"
          wordEl.style.maskImage = "url('" + TEXTURE_URL + "')"

          shadow.appendChild(wordEl)
          container.appendChild(shadow)

          var dur = Math.max(w.end - w.start + 0.3, 0.4)

          tl.set(shadow, { visibility: 'visible', opacity: 0 }, w.start)
          tl.fromTo(
            shadow,
            { opacity: 0, scale: 0.88 },
            { opacity: 1, scale: 1, duration: 0.18, ease: 'power3.out' },
            w.start,
          )
          tl.set(wordEl, { '--mask-position': '0% 50%' }, w.start)
          tl.to(
            wordEl,
            { '--mask-position': '100% 50%', duration: dur, ease: 'sine.inOut' },
            w.start,
          )

          tl.to(shadow, { opacity: 0, scale: 1.08, duration: 0.1, ease: 'power2.in' }, w.end)
          tl.set(shadow, { opacity: 0, visibility: 'hidden' }, w.end + 0.1)
        })

        function fitAll() {
          WORDS.forEach(function (w, wi) {
            wordEls[wi].style.fontSize =
              'min(calc(200 * var(--u)), calc(90cqw / ' + widthInEm(w.text).toFixed(4) + '))'
          })
        }
        fitAll()
        // 量字要用真正显示的字体：字体用到才下载，脚本运行时可能还没到，到了之后按真实字形再量一次。
        document.fonts
          .load(
            measureContext.font,
            WORDS.map(function (w) {
              return w.text
            }).join(''),
          )
          .then(fitAll)

        tl.seek(0)
        window.__timelines['caption-texture'] = tl
      })()
    </script>
  </div>
</template>
