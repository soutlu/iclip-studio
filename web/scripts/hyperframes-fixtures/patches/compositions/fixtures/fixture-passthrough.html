<!doctype html>
<!--
  测试夹具组件（4 秒，未声明固定尺寸、铺满宿主）：
  - 组件根声明 pointer-events: none（模拟组件库常见播放点穿写法），左上角含固定无动画绿色徽标（.fp-badge），
    验证组件根屏蔽指针时点击内部可视内容仍能整体选中贴片、拖拽移动且围绕中心等比缩放；
  - 右下角含溢出裁剪窗（.fp-window，overflow: hidden）及超大琥珀色内层（.fp-wide），验证可见裁剪框计算；
  - 左下角留空，验证点击贴片透明空白区可透传选中下方视频。
-->
<html lang="zh-CN" data-composition-id="fixture-passthrough" data-composition-duration="4">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="fixture-passthrough" data-duration="4">
        <style>
          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
          }
          #root .fp-badge {
            position: absolute;
            left: 10%;
            top: 20%;
            width: 40%;
            height: 15%;
            background: #16a34a;
          }
          #root .fp-window {
            position: absolute;
            left: 55%;
            top: 50%;
            width: 30%;
            height: 20%;
            overflow: hidden;
          }
          #root .fp-wide {
            position: absolute;
            left: -50%;
            top: -50%;
            width: 200%;
            height: 200%;
            background: #f59e0b;
          }
        </style>
        <div
          id="fixture-passthrough-clip"
          class="clip"
          data-start="0"
          data-duration="4"
          data-track-index="0"
        >
          <div class="fp-badge"></div>
          <div class="fp-window"><div class="fp-wide"></div></div>
        </div>
        <script src="vendor/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          ;(function () {
            var tl = gsap.timeline({ paused: true })
            tl.set({}, {}, 4)
            window.__timelines = window.__timelines || {}
            window.__timelines['fixture-passthrough'] = tl
          })()
        </script>
      </div>
    </template>
  </body>
</html>
