<!doctype html>
<!--
  测试组件库：4 秒的组件（component），没写尺寸、铺满所在位置。组件根写着 pointer-events: none（组件库里常见的
  写法，播放时让画面点穿），里面左上方一块绿色徽标（.fp-badge），位置固定、没有动画。用来测组件根不接收指针时，
  画面上点它里面照样选中整个贴片、拖得动、缩放时中心不动。右下方一扇裁切窗（.fp-window，overflow: hidden），
  里面一块比窗大得多的琥珀色底（.fp-wide），只露出窗里那一块。左下方空着：用来测点贴片里什么都没画的地方
  点到下面的画面。
-->
<html lang="zh-CN" data-composition-id="fixture-passthrough" data-composition-duration="4">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="fixture-passthrough" data-duration="4">
        <style>
          #root {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
          }
          #root .fp-badge {
            position: absolute;
            left: 10%;
            top: 20%;
            width: 40%;
            height: 15%;
            background: #16a34a;
          }
          #root .fp-window {
            position: absolute;
            left: 55%;
            top: 50%;
            width: 30%;
            height: 20%;
            overflow: hidden;
          }
          #root .fp-wide {
            position: absolute;
            left: -50%;
            top: -50%;
            width: 200%;
            height: 200%;
            background: #f59e0b;
          }
        </style>
        <div
          id="fixture-passthrough-clip"
          class="clip"
          data-start="0"
          data-duration="4"
          data-track-index="0"
        >
          <div class="fp-badge"></div>
          <div class="fp-window"><div class="fp-wide"></div></div>
        </div>
        <script src="vendor/npm/gsap@3.14.2/dist/gsap.min.js"></script>
        <script>
          ;(function () {
            var tl = gsap.timeline({ paused: true })
            tl.set({}, {}, 4)
            window.__timelines = window.__timelines || {}
            window.__timelines['fixture-passthrough'] = tl
          })()
        </script>
      </div>
    </template>
  </body>
</html>
