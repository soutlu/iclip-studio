<!doctype html>
<!--
  测试组件库：2 秒的块，放在自己的目录里。卡片上的字写在同目录的 assets/fixture-sidecar.json 里，
  按这个文件自己的位置读，用来覆盖条目自带旁挂文件的情形。
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        overflow: hidden;
      }
      body {
        width: 1920px;
        height: 1080px;
      }

      #root .fsc-stage {
        position: absolute;
        inset: 0;
        background: #0f766e;
      }
      #root .fsc-label {
        position: absolute;
        left: 160px;
        top: 480px;
        font: 700 96px sans-serif;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="fixture-sidecar"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="2"
    >
      <div id="fsc-clip" class="clip" data-start="0" data-duration="2" data-track-index="0">
        <div class="fsc-stage">
          <div id="fsc-label" class="fsc-label"></div>
        </div>
      </div>
    </div>

    <script>
      var assetUrl = function (path) {
        return typeof __hyperframes !== 'undefined' && __hyperframes.assetUrl
          ? __hyperframes.assetUrl(path)
          : path
      }
      fetch(assetUrl('assets/fixture-sidecar.json'))
        .then(function (response) {
          return response.json()
        })
        .then(function (data) {
          document.getElementById('fsc-label').textContent = data.label
        })
    </script>
  </body>
</html>
