# 同源部署：静态产物 + /api 去前缀反代到后端，约定见 contract/conventions.md §1。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    # 两边都带斜杠：/api/users/me 到后端变成 /users/me。
    location /api/ {
        proxy_pass http://server:7788/;
        proxy_http_version 1.1;
        # 后端用 Origin 与 Host 比对同源，Host 必须原样带端口传过去。
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 带 hash 的构建产物永久缓存。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HyperFrames 组件库（部署目录的 components/ 只读挂到这里）。目录 catalog.json 发布新组件库时整份替换，
    # 每次都回源核对；其余文件在 <版本号>/ 下，内容不变，永久缓存。
    location = /hyperframes/catalog.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # location 里写 types 会整张替换继承来的类型表，所以先引入默认表，再补默认表里没有的几种。
    location ^~ /hyperframes/ {
        include /etc/nginx/mime.types;
        types {
            audio/wav wav;
            model/gltf-binary glb;
            text/markdown md;
        }
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 单页应用：未命中的路径交给前端路由。
    location / {
        try_files $uri /index.html;
    }
}
