source_roots = ["src"]

# 视频格式：镜头组规则、出片正文的拼装与反拆、制作页视图的形状，后端的生成、资料库与对话也用。
[[modules]]
path = "iclip_video.shot_rules"
depends_on = []
utility = true

[[modules]]
path = "iclip_video.shot_prompt"
depends_on = ["iclip_video.shot_rules"]

[[modules]]
path = "iclip_video.film_view"
depends_on = []

# 插件包共用、不带工具的模块。
[[modules]]
path = "iclip_video.shot_document"
depends_on = ["iclip_video.shot_rules"]

[[modules]]
path = "iclip_video.video_document"
depends_on = []

[[modules]]
path = "iclip_video.video_understanding"
depends_on = ["iclip_video.video_document"]

# 插件包之间不互相 import。
[[modules]]
path = "iclip_video.video"
depends_on = ["iclip_video.video_document", "iclip_video.video_understanding"]

[[modules]]
path = "iclip_video.video_shots"
depends_on = ["iclip_video.shot_document"]

[[modules]]
path = "iclip_video.video_breakdown"
depends_on = []

# 引用 video 只为在 get_ordering().requires 里写依赖（docs/architecture.md 的唯一例外）。
[[modules]]
path = "iclip_video.shot_video"
depends_on = [
    "iclip_video.shot_document",
    "iclip_video.video_document",
    "iclip_video.video",
]

[[modules]]
path = "iclip_video.iclip_studio"
depends_on = [
    "iclip_video.shot_rules",
    "iclip_video.shot_prompt",
    "iclip_video.film_view",
    "iclip_video.shot_document",
]

# 工作区插件查图片信息用的 OSS 实现。
[[modules]]
path = "iclip_video.oss_media"
depends_on = []

# 要后端服务的端口经内部接口的 HTTP 实现，请求与答复用各插件包的 wire 模型。
[[modules]]
path = "iclip_video.internal_api"
depends_on = ["iclip_video.shot_video", "iclip_video.video_breakdown"]

# 运行时服务的入口：按配置把各插件包绑进插件登记表，可以引用每个插件包。
[[modules]]
path = "iclip_video.registry"
depends_on = [
    "iclip_video.iclip_studio",
    "iclip_video.internal_api",
    "iclip_video.oss_media",
    "iclip_video.shot_video",
    "iclip_video.video",
    "iclip_video.video_breakdown",
    "iclip_video.video_shots",
    "iclip_video.video_understanding",
]
