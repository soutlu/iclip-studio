[project]
name = "iclip-video-plugins"
version = "0.1.0"
description = "视频业务的 agent 插件（导演工程、视频理解、镜头组表）与共用的视频格式代码，只依赖 Agent 运行时"
requires-python = ">=3.13"
dependencies = [
    "agent-runtime",
    "pydantic>=2.13.5",
    "pydantic-ai-slim>=2.62.0",
    "httpx>=0.28.1",  # 视频理解的方舟适配器
]

[tool.uv.sources]
agent-runtime = { path = "../../runtime", editable = true }

[dependency-groups]
dev = [
    "structlog>=26.1.0",  # 测试用 structlog.testing 抓日志
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.6",
    "pyright>=1.1.411",
    "tach>=0.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iclip_video"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "TID251"]
# RUF001/002/003：中文全角标点是本仓文案约定，不是笔误。
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

# 日志统一由宿主服务配置。
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logging.getLogger".msg = "日志走 structlog：_logger = structlog.stdlib.get_logger(__name__)"
"structlog.get_logger".msg = "用带类型的 structlog.stdlib.get_logger(__name__)"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["TID251"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
# 第三方库无完整类型导出产生的 Unknown 噪音；结构性 strict 检查全部保留。
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 单个用例的墙钟上限：卡住就报错并打印栈，不让整条门禁挂死。
timeout = 180
markers = [
    "unit: 纯逻辑与进程内契约（默认门禁）",
    "integration_no_llm: 无 LLM 的集成面，使用真实 Postgres（默认门禁）",
    "integration_llm: 真实模型（外部门禁）",
    "e2e_full: 全链路（外部门禁）",
    "external: 依赖外部凭证（外部门禁）",
]
